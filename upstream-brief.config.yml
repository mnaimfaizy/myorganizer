# MyOrganizer adapter for the portable Upstream Brief skill.
# Schema: .agents/skills/upstream-brief/ADAPTER.md

version_record:
  path: TECH_STACK.md

# ADR 0084 items 1-2. Each Ecosystem's Baseline is resolved from what is
# installed, never from this file or from the entry below — the version
# record is compared against for a drift note (routed to DepSync), never
# read as a source. Members are discovered by the lead's npm scope prefix
# (`nx` -> `@nx/*`) and can be extended or trimmed with `members.add` /
# `members.remove`. See `.agents/skills/upstream-brief/resolve-baseline.mjs`.
ecosystems:
  - lead: nx
  - lead: next
    members:
      add: [eslint-config-next]
  - lead: react-native

# ADR 0084 item 12. Upstream Opportunities a human declined, remembered so the
# next run stays quiet about them until the Baseline leaves the recorded range
# or the upstream quote changes. Nothing has been declined yet; the shape is
# `{ecosystem, url, site, reason, baseline_range, quote}` (see ADAPTER.md), and
# `yarn upstream:briefs:check` fails an entry whose Ecosystem or site is gone.
# Written as a bare key rather than `[]`: the adapter reader matches the header
# line exactly, so an entry added under a `[]` spelling would be read by nobody.
declined_opportunities:

instruction_globs:
  - '**/AGENTS.md'
  - CLAUDE.md
  - GEMINI.md
  - DEVELOPMENT.md
  - .github/copilot-instructions.md
  - .claude/checklist.md
  - .agents/skills/**/*.md
  - .github/agents/*.agent.md
  - docs/ui/GUIDELINES.md

script_globs:
  - tools/scripts/check-component-hygiene.mjs
  - tools/scripts/check-test-hygiene.mjs
  - tools/scripts/check-readme.mjs
  - tools/scripts/check-vault-pages.mjs
  - tools/scripts/check-auth-pages.mjs
  - tools/scripts/check-mobile-platform.mjs

source_globs:
  - apps/myorganizer/src/**/*.{ts,tsx}
  - apps/backend/src/**/*.{ts,js}
  - apps/mobile/src/**/*.{ts,tsx}
  - libs/web/ui/src/**/*.{ts,tsx}
  - libs/web/pages/**/src/**/*.{ts,tsx}
  - libs/mobile/**/*.{ts,tsx}

brief_dir: docs/research

# ADR 0084 item 13. Two labels and no third: a `quality` role used to map to
# `qa`, which ADR 0049 reserves for a QA Plan Issue, so every brief issue
# arrived labelled as something it was not.
issue:
  tracker: github
  repository: mnaimfaizy/myorganizer
  labels:
    research: research
    hitl: type:hitl
