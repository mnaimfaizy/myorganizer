apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    entryFile = file("../../src/main.tsx")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    //   React Native 0.87 ships hermesc in the hermes-compiler package, hoisted to
    //   the workspace root. The command runs from the React root (apps/mobile), not
    //   from this directory, so the path is resolved here and passed absolute.
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc").absolutePath
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Gradle properties that sign a release build. Set them in the user-level
 * ~/.gradle/gradle.properties, never in a file inside the repository.
 */
def releaseSigningProperties = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
    .collect { "MYORGANISER_RELEASE_${it}".toString() }
def releaseSigningProperty = { String suffix -> findProperty("MYORGANISER_RELEASE_${suffix}") }
def releaseSigningFailure = { ->
    def tracked = new Properties()
    rootProject.file('gradle.properties').withInputStream { tracked.load(it) }
    def committed = releaseSigningProperties.findAll { tracked.containsKey(it) }
    if (committed) {
        return "Release signing properties are set in the tracked apps/mobile/android/gradle.properties: " +
            "${committed.join(', ')}. Remove them and set them in ~/.gradle/gradle.properties."
    }
    def missing = releaseSigningProperties.findAll { !findProperty(it) }
    if (missing) {
        return "Release signing is not configured. Missing user-level Gradle properties " +
            "(~/.gradle/gradle.properties): ${missing.join(', ')}. " +
            "See the Android signing step in docs/deployment/MOBILE_RELEASE_PROCESS.md."
    }
    return null
}()

// Fail before task lookup: without a release signing config, AGP never
// creates installRelease, so `run-android --mode release` would otherwise
// stop at "task not found" instead of naming the missing properties.
if (releaseSigningFailure && gradle.startParameter.taskNames.any { it.endsWith('Release') }) {
    throw new GradleException(releaseSigningFailure)
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "app.myorganiser"

    // The bundled app fonts live with the rest of the app's source, not under
    // android/. Pointing the asset source set at apps/mobile/src/assets puts
    // this repo's `fonts/` directory at `assets/fonts/` in the APK, which is
    // where React Native's font manager looks — and keeps one copy of each
    // .ttf instead of one per platform. See src/assets/fonts/README.md.
    sourceSets {
        main {
            assets.srcDirs += ["../../src/assets"]
        }
    }

    defaultConfig {
        applicationId "app.myorganiser"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The release signing key is the app's permanent signing identity
        // (ADR 0127); see docs/deployment/MOBILE_RELEASE_PROCESS.md.
        if (!releaseSigningFailure) {
            release {
                storeFile file(releaseSigningProperty('STORE_FILE'))
                storePassword releaseSigningProperty('STORE_PASSWORD')
                keyAlias releaseSigningProperty('KEY_ALIAS')
                keyPassword releaseSigningProperty('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never the debug key: without the properties, the release build fails.
            if (!releaseSigningFailure) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // BiometricPrompt with a CryptoObject for the Biometric Unlock keystore
    // (app.myorganiser.biometrickeystore). The same version react-native-keychain
    // already brings in, declared here because that one is not on this
    // module's compile classpath.
    implementation("androidx.biometric:biometric:1.1.0")

    // The Material 3 app theme (res/values/styles.xml) that the Material date
    // dialog reads its calendar theme from. The same version
    // @react-native-community/datetimepicker already brings in, declared here
    // because that one is not on this module's compile classpath.
    implementation("com.google.android.material:material:1.12.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// A release build reached indirectly (e.g. through `build`) refuses to run
// too, rather than falling back to the debug key. Debug builds never get here.
def releaseSigningFailureAtRun = releaseSigningFailure
tasks.named { it == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (releaseSigningFailureAtRun) {
            throw new GradleException(releaseSigningFailureAtRun)
        }
    }
}
