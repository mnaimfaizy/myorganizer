name: Run the code reviewer
description: >-
  Runs the /code-review skill through anthropics/claude-code-action against a
  commit range, keeps the transcript, and validates the JSON report it wrote.
  Shared by code-review.yml (a pull request) and review-golden-replay.yml (a
  historical range), so the tool allowlist, the prompt discipline, and the
  report lookup live in one place (ADR 0070, ADR 0071).

inputs:
  base:
    description: The fixed point (base SHA).
    required: true
  head:
    description: The head SHA the findings address.
    required: true
  head-ref:
    description: The branch name, or "none (historical range)".
    required: true
  tier:
    description: The Review Tier label from the classifier, or "null" when the range has none.
    required: true
  facts:
    description: Extra prompt lines specific to the caller, one per line, each starting with "- ".
    required: false
    default: ''
  model:
    description: The model id.
    required: true
  oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN, if set.
    required: false
    default: ''
  api-key:
    description: ANTHROPIC_API_KEY, if set.
    required: false
    default: ''
  github-token:
    description: The job token the action uses for its own plumbing.
    required: true
  transcript-artifact:
    description: Artifact name for the reviewer transcript.
    required: true

outputs:
  reviewer-outcome:
    description: success or failure of the action step.
    value: ${{ steps.reviewer.outcome }}
  validated:
    description: true when tmp/code-review/normalized.json was written.
    value: ${{ steps.validate.outputs.validated }}
  rejected-file:
    description: Path of the file holding the rejection reason when validation failed.
    value: ${{ steps.validate.outputs.rejected_file }}
  rate-limited:
    description: >-
      `true` when the reviewer was cut off by the subscription's rate limit,
      `false` when the transcript says it was not, `unknown` when the transcript
      could not be read. A case that is not `false` measured nothing and must
      not be read as a miss.
    value: ${{ steps.limits.outputs.rate_limited }}
  turn-exhausted:
    description: >-
      `true` when the reviewer hit the turn ceiling. This can be `true`
      alongside `validated: true` — dispatching both axes first (the skill's
      step 3) means a run the ceiling cut short partway through often still
      wrote and validated a report before it ended; a caller should read
      `validated` first and only fall back to this output when it is not
      `true`. When there is no report, this measured nothing and must not be
      read as a miss, and it is reported separately from a rate-limit lockout
      because it has a different cause and a different fix: the ceiling, or
      whatever burned the turns.
    value: ${{ steps.limits.outputs.turn_exhausted }}
  prevented:
    description: >-
      `true` when turn exhaustion was driven by the harness refusing a
      permission the reviewer's own instructions told it to use — the skill
      or the CI prompt disagreed with `--allowedTools`, and the disagreement,
      not the case, burned the turns. `false` when the reviewer hit the
      ceiling with no permission denials, or did not hit it at all. Like
      `turn-exhausted`, this can be `true` alongside `validated: true`; a
      caller should read `validated` first. This is the one outcome someone
      can fix by editing the allowlist or the instructions; a window lockout
      and a case the reviewer genuinely read and missed are not.
    value: ${{ steps.limits.outputs.prevented }}

runs:
  using: composite
  steps:
    # The obligation worklist, matched against the diff outside the model
    # (docs/review/REVIEW_CHECKLIST.md). This lives in the shared action rather
    # than in code-review.yml because the golden replay calls the action
    # directly: an obligation the replay cannot see is an obligation nothing
    # can ever measure. An empty worklist is normal and costs nothing.
    - name: Select the obligations
      shell: bash
      run: |
        mkdir -p tmp/code-review
        corepack yarn review:obligations:select \
          --base "${{ inputs.base }}" --head "${{ inputs.head }}" \
          --out tmp/code-review/obligations.json

    # JSON only. The allowed tools are read, search, sub-agents, git reads,
    # existing Nx targets, the validator, and `node` for a reviewer-written
    # reproduction (the executed-evidence class ADR 0071 values most); no gh,
    # no network, no push. The action's own GitHub tools are not in the list,
    # so the reviewer cannot post. `github_token` is the job token: the action
    # uses it for its own plumbing instead of minting a GitHub App token.
    # Write and Edit are scoped to tmp/code-review/** — the report, the
    # obligation answer sheet, and the throwaway worktree all live there. A
    # replay run found the gap an unscoped grant leaves: refused an inline
    # script, the reviewer wrote a scratch script outside its worktree and
    # ran that instead (ADR 0071 item 4, corrected by ADR 0075). The
    # interpreter (`node`) stays unrestricted in path — it is how executed
    # evidence gets produced — only the writable surface is narrowed.
    - name: Run the reviewer
      id: reviewer
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        anthropic_api_key: ${{ inputs.api-key }}
        github_token: ${{ inputs.github-token }}
        prompt: |
          /code-review

          You are running in CI (see "In CI" in the skill). Facts for this run:
          - fixed point (base): ${{ inputs.base }}
          - head: ${{ inputs.head }}
          - branch name: ${{ inputs.head-ref }}
          - tier: ${{ inputs.tier }}
          ${{ inputs.facts }}
          - dispatch both sub-agents (the skill's step 3) as your first substantive action, right after you have the diff command, the commit list, and the spec fact below — before you read CODING_STANDARDS.md, walk the tree for nested AGENTS.md files, or do any other exploration of your own. Both calls go in the SAME message so they still run in parallel. A run cut short after that message still has two axes' worth of findings to assemble into a report (step 5); a run cut short before it has nothing to write, which is the whole reason this comes first.
          - obligations: the worklist for this diff is already selected in tmp/code-review/obligations.json. Read it, answer every site as the skill's step 4 says, and write tmp/code-review/obligations.answers.json. Every field an entry lists in citedFields carries a citation — the file, the line, and the literal text at that line, read from the tree at head — and the check compares that quotation to the tree: a quotation that does not match fails the pipeline check, as does an answer meeting its own defectWhen while raising no finding. Neither is a finding; both are facts about you. An empty "selected" array means nothing fired; write no answer sheet and move on. Do not re-run the selector. Do this after the sub-agents are dispatched, not before: if you are running low on turns when you get to this step, skip it and go straight to step 5 with what the sub-agents already returned — an unanswered obligation fails nothing, but a report you never write is silence.
          - spec: already resolved in tmp/code-review/spec.json. Read it. Do not fetch issues, do not ask anyone. If its spec.kind is "none", skip the Spec axis.
          - write the envelope to exactly tmp/code-review/report.json (this path, not <head>.report.json) and run the validator on it as the skill says. Do not run the renderer and do not post anything: a later step publishes.
          - the model id to record in the envelope: ${{ inputs.model }}
          - your run ends the moment you reply without calling a tool, and no background notification ever reaches you here. Invoke each sub-agent with the Agent tool's `run_in_background: false` (both calls in one message so they still run in parallel); the results come back in that same turn. Never reply "waiting", never schedule a wake-up, and do not stop until tmp/code-review/report.json exists and the validator has run on it. A run that ends without that file is a rejected report and a failed check.
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns 80
          --allowedTools "Read,Glob,Grep,Write(tmp/code-review/**),Edit(tmp/code-review/**),Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git grep:*),Bash(git blame:*),Bash(git worktree:*),Bash(corepack yarn nx test:*),Bash(corepack yarn nx lint:*),Bash(corepack yarn nx typecheck:*),Bash(corepack yarn nx show:*),Bash(corepack yarn review:validate:*),Bash(yarn nx test:*),Bash(yarn nx lint:*),Bash(yarn nx typecheck:*),Bash(node:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*),Bash(echo:*),Bash(rm -f tmp/code-review/*)"

    # A reviewer stopped by the five-hour subscription window produces no
    # report, which is indistinguishable from a reviewer that read the diff and
    # found nothing — and the golden set scores the second as a miss. That
    # mistake was made once already: the whole of run 34176461268 was read as
    # `0 of 7` recall when in fact every one of its seven sessions was cut off,
    # three before their first turn. The transcript says which happened, so
    # read it here rather than leaving it to whoever opens the artifact.
    - name: Detect a rate-limit lockout or a prevented measurement
      id: limits
      if: always() && steps.reviewer.outputs.execution_file != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
      run: |
        set -uo pipefail
        # Three answers, not two. A detector that cannot read the transcript
        # must not answer "no rate limit": that is the reading which lets a
        # lockout be scored as a miss, and it is the whole failure this step
        # exists to prevent. jq exits 5 on a parse error and on a type error
        # from a reshaped transcript, so the exit code is separated from the
        # boolean rather than folded into it with `-e`.
        HITS="$(jq '[.[] | select(type == "object")
                        | select(.type == "rate_limit_event")
                        | .rate_limit_info
                        | select(type == "object")
                        | select(.status == "rejected")] | length'                   "$EXECUTION_FILE" 2>&1)"
        JQ_STATUS=$?
        if [ "$JQ_STATUS" -ne 0 ] || ! [ "$HITS" -eq "$HITS" ] 2>/dev/null; then
          echo "::warning::could not read $EXECUTION_FILE for rate-limit events (jq exit $JQ_STATUS); treating the result as unknown"
          echo 'rate_limited=unknown' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$HITS" -gt 0 ]; then
          WINDOW="$(jq -r '[.[] | select(type == "object") | select(.type == "rate_limit_event") | .rate_limit_info][-1].rateLimitType // "unknown"' "$EXECUTION_FILE" 2>/dev/null || echo unknown)"
          TURNS="$(jq -r '[.[] | select(type == "object") | select(.type == "result")][-1].num_turns // 0' "$EXECUTION_FILE" 2>/dev/null || echo 0)"
          echo "::error::the reviewer was cut off by the $WINDOW rate limit after $TURNS turn(s); this run measured nothing and is not a miss"
          echo 'rate_limited=true' >> "$GITHUB_OUTPUT"
        else
          echo 'rate_limited=false' >> "$GITHUB_OUTPUT"
        fi

        # Turn exhaustion is a third outcome, and until run 45 the apparatus
        # had no word for it: groceries-blob-type-without-fanouts stopped at
        # error_max_turns with 26 permission denials, the detector correctly
        # said rate_limited=false, and the job fell through to "no valid
        # report" - indistinguishable from a miss. ADR 0072 demotes a guard
        # case on one miss, so that silence would have demoted a case the
        # reviewer never failed: the same error the rate-limit rule exists to
        # prevent, through a different door.
        SUBTYPE="$(jq -r '[.[] | select(type == "object") | select(.type == "result")][-1].subtype // ""' "$EXECUTION_FILE" 2>/dev/null || echo '')"
        if [ "$SUBTYPE" = 'error_max_turns' ]; then
          TURNS="$(jq -r '[.[] | select(type == "object") | select(.type == "result")][-1].num_turns // 0' "$EXECUTION_FILE" 2>/dev/null || echo 0)"
          DENIED="$(jq -r '[.[] | select(type == "object") | select(.type == "result")][-1].permission_denials_count // 0' "$EXECUTION_FILE" 2>/dev/null || echo 0)"
          echo "::error::the reviewer hit the turn ceiling after $TURNS turn(s) with $DENIED permission denial(s); this run measured nothing and is not a miss"
          echo 'turn_exhausted=true' >> "$GITHUB_OUTPUT"
          # 26 permission denials is not a hard case; it is the allowlist and
          # the instructions disagreeing about what the reviewer may do, and
          # that disagreement is what burned the turns, not the diff. That is
          # a bug someone can fix by editing the allowlist or the skill.
          # Plain turn exhaustion with no denial is a genuinely hard case (or,
          # after the axes dispatch first, usually a run that still wrote a
          # report — see "Require a validated report").
          if [ "$DENIED" -gt 0 ] 2>/dev/null; then
            echo "::error::$DENIED of those turns were spent on a permission the reviewer's own instructions told it to use and --allowedTools refused; this measurement was prevented by the apparatus, not by a hard case"
            echo 'prevented=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prevented=false' >> "$GITHUB_OUTPUT"
          fi
        else
          echo 'turn_exhausted=false' >> "$GITHUB_OUTPUT"
          echo 'prevented=false' >> "$GITHUB_OUTPUT"
        fi

    # The action hides the reviewer's transcript from the log. Keep it as a
    # short-lived artifact so a run that wrote no report can be read.
    - name: Keep the reviewer transcript
      if: steps.reviewer.outputs.execution_file != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.transcript-artifact }}
        path: ${{ steps.reviewer.outputs.execution_file }}
        retention-days: 7

    # The script, not the model, decides whether the report stands. The
    # caller's tier overrides whatever the envelope says (ADR 0070 item 3).
    - name: Validate the report
      id: validate
      shell: bash
      run: |
        set +e
        REJECTED="$RUNNER_TEMP/rejected.txt"
        echo "rejected_file=$REJECTED" >> "$GITHUB_OUTPUT"
        # Accept the skill's interactive name too, in case the reviewer
        # followed step 5 rather than the prompt.
        if [ ! -f tmp/code-review/report.json ]; then
          candidate="$(ls tmp/code-review/*.report.json 2>/dev/null | head -1 || true)"
          if [ -n "$candidate" ]; then
            echo "using $candidate"
            mv "$candidate" tmp/code-review/report.json
          fi
        fi
        if [ ! -f tmp/code-review/report.json ]; then
          echo "the reviewer wrote no tmp/code-review/report.json (reviewer step outcome: ${{ steps.reviewer.outcome }}; see the run log or the transcript artifact)" | tee "$REJECTED"
          echo 'validated=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ '${{ inputs.tier }}' = 'null' ]; then
          corepack yarn review:validate tmp/code-review/report.json --out tmp/code-review/normalized.json 2> >(tee "$REJECTED" >&2)
        else
          corepack yarn review:validate tmp/code-review/report.json --tier '${{ inputs.tier }}' --out tmp/code-review/normalized.json 2> >(tee "$REJECTED" >&2)
        fi
        if [ -f tmp/code-review/normalized.json ]; then
          echo 'validated=true' >> "$GITHUB_OUTPUT"
        else
          echo 'validated=false' >> "$GITHUB_OUTPUT"
        fi
