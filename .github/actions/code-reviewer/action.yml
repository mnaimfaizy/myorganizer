name: Run the code reviewer
description: >-
  Runs the /code-review skill through anthropics/claude-code-action against a
  commit range, keeps the transcript, and validates the JSON report it wrote.
  Shared by code-review.yml (a pull request) and review-golden-replay.yml (a
  historical range), so the tool allowlist, the prompt discipline, and the
  report lookup live in one place (ADR 0070, ADR 0071).

inputs:
  base:
    description: The fixed point (base SHA).
    required: true
  head:
    description: The head SHA the findings address.
    required: true
  head-ref:
    description: The branch name, or "none (historical range)".
    required: true
  tier:
    description: The Review Tier label from the classifier, or "null" when the range has none.
    required: true
  facts:
    description: Extra prompt lines specific to the caller, one per line, each starting with "- ".
    required: false
    default: ''
  model:
    description: The model id.
    required: true
  oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN, if set.
    required: false
    default: ''
  api-key:
    description: ANTHROPIC_API_KEY, if set.
    required: false
    default: ''
  github-token:
    description: The job token the action uses for its own plumbing.
    required: true
  transcript-artifact:
    description: Artifact name for the reviewer transcript.
    required: true
  tooling-dir:
    description: >-
      Where the review scripts this action runs (the obligation selector and
      the validator) live. `.` for a pull request, whose checkout is both the
      tree under review and the tooling. The golden replay passes a copy of
      the pull request's scripts extracted outside the workspace, because its
      workspace is the case head, which predates them (ADR 0102).
    required: false
    default: '.'

outputs:
  reviewer-outcome:
    description: success or failure of the action step.
    value: ${{ steps.reviewer.outcome }}
  validated:
    description: >-
      true when tmp/code-review/normalized.json was written. A validated
      report is not yet a run that passed: `runFacts.failures` in that file
      lists the run facts that fail "Agent Review Ran" (ADR 0123 item 4),
      and the caller reads it.
    value: ${{ steps.validate.outputs.validated }}
  facts-file:
    description: >-
      Path of the run facts file read from the reviewer transcript (ADR 0123).
      It is outside the workspace and always written. Any step that validates
      the report again must pass it as `--facts`, with the same `--worklist`:
      a validation without `--facts` puts the reviewer's own claims back into
      the normalized report and judges nothing, and one without `--worklist`
      fails an obligation finding as one the main agent authored.
    value: ${{ steps.facts.outputs.facts_file }}
  rejected-file:
    description: Path of the file holding the rejection reason when validation failed.
    value: ${{ steps.validate.outputs.rejected_file }}
  rate-limited:
    description: >-
      `true` when the reviewer was cut off by the subscription's rate limit,
      `false` when the transcript says it was not, `unknown` when the transcript
      could not be read. A case that is not `false` measured nothing and must
      not be read as a miss.
    value: ${{ steps.limits.outputs.rate_limited }}
  turn-exhausted:
    description: >-
      `true` when the reviewer hit the turn ceiling. This can be `true`
      alongside `validated: true` — dispatching both axes first (the skill's
      step 3) means a run the ceiling cut short partway through often still
      wrote and validated a report before it ended; a caller should read
      `validated` first and only fall back to this output when it is not
      `true`. When there is no report, this measured nothing and must not be
      read as a miss, and it is reported separately from a rate-limit lockout
      because it has a different cause and a different fix: the ceiling, or
      whatever burned the turns.
    value: ${{ steps.limits.outputs.turn_exhausted }}
  prevented:
    description: >-
      `true` when the harness refused a permission the reviewer's own
      instructions told it to use, on either of two grounds. One: turn
      exhaustion with permission denials — the skill or the CI prompt
      disagreed with `--allowedTools`, and the disagreement, not the case,
      burned the turns. Two: a refused Write or Edit to one of the reviewer's
      required outputs (`tmp/code-review/report.json` or the interactive
      `<head>.report.json` the validate step also accepts, and
      `tmp/code-review/obligations.answers.json`), however the run ended —
      a run that ends `success` after being refused its own report measured
      nothing (issue #880). `false` otherwise. This can be `true` alongside
      `validated: true`; a caller should read `validated` first. This is the
      one outcome someone can fix by editing the allowlist or the
      instructions; a window lockout and a case the reviewer genuinely read
      and missed are not.
    value: ${{ steps.limits.outputs.prevented }}
  total-cost-usd:
    description: >-
      The `total_cost_usd` the transcript's last `result` event reports, or
      empty when there is no transcript to read. Read from the same event
      the rate-limit and turn-ceiling detection already reads, so a caller
      (the golden replay's results record, issue #932) gets it from one
      place regardless of how the run ended.
    value: ${{ steps.limits.outputs.total_cost_usd }}
  turns:
    description: >-
      The `num_turns` the transcript's last `result` event reports, or empty
      when there is no transcript to read.
    value: ${{ steps.limits.outputs.turns }}

runs:
  using: composite
  steps:
    # The obligation worklist, matched against the diff outside the model
    # (docs/review/REVIEW_CHECKLIST.md). This lives in the shared action rather
    # than in code-review.yml because the golden replay calls the action
    # directly: an obligation the replay cannot see is an obligation nothing
    # can ever measure. An empty worklist is normal and costs nothing.
    #
    # The selector runs from the tooling directory, because the catalogue it
    # reads is cwd-relative, and diffs through the workspace's git directory,
    # because an extracted tooling copy is not a repository; run-from-tooling
    # joins the two (ADR 0102).
    - name: Select the obligations
      shell: bash
      env:
        TOOLING: ${{ inputs.tooling-dir }}
      run: |
        set -euo pipefail
        mkdir -p tmp/code-review
        node "$TOOLING/tools/scripts/review/run-from-tooling.mjs" review/select-obligations.mjs \
          --base "${{ inputs.base }}" --head "${{ inputs.head }}" \
          --out "$PWD/tmp/code-review/obligations.json"

    # JSON only. The allowed tools are read, search, sub-agents, git reads,
    # existing Nx targets, the validator, and `node` for a reviewer-written
    # reproduction (the executed-evidence class ADR 0071 values most); no gh,
    # no network, no push. The action's own GitHub tools are not in the list,
    # so the reviewer cannot post. `github_token` is the job token: the action
    # uses it for its own plumbing instead of minting a GitHub App token.
    # Write and Edit are scoped to tmp/code-review/** — the report, the
    # obligation answer sheet, and the throwaway worktree all live there. A
    # replay run found the gap an unscoped grant leaves: refused an inline
    # script, the reviewer wrote a scratch script outside its worktree and
    # ran that instead (ADR 0071 item 4, corrected by ADR 0075, whose grant
    # spelling ADR 0118 corrects). The
    # interpreter (`node`) stays unrestricted in path — it is how executed
    # evidence gets produced — only the writable surface is narrowed.
    #
    # The grant is `Edit(/tmp/code-review/**)`, with the leading slash, and
    # there is no `Write(…)` path rule beside it. Both are deliberate, and
    # both come from Claude Code's documented rule syntax
    # (https://code.claude.com/docs/en/permissions#read-and-edit):
    #   - A bare `tmp/code-review/**` is relative to the session's *current*
    #     directory, and the Bash tool keeps a `cd`. Golden replay run
    #     35716439899 changed into tmp/code-review/worktree, after which the
    #     grant covered …/worktree/tmp/code-review/** and every write to the
    #     real report path was refused; a sibling run that never ran `cd`
    #     wrote the same absolute paths without trouble (issue #880). A
    #     `/path` rule passed as a CLI flag anchors at the primary working
    #     directory — the workspace — wherever the session has moved.
    #   - File permissions are checked against `Edit(path)` rules only; an
    #     Edit rule covers every built-in tool that edits files, Write
    #     included, and a `Write(path)` rule is accepted but never consulted.
    # `yarn review:allowlist:check` fails either mistake (ADR 0118).
    - name: Run the reviewer
      id: reviewer
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        anthropic_api_key: ${{ inputs.api-key }}
        github_token: ${{ inputs.github-token }}
        # By default the action refuses a workflow initiated by a bot actor,
        # which makes every Cursor Cloud Agent push (attributed to `cursor[bot]`)
        # fail "Agent Review Ran" with "non-human actor: cursor" instead of being
        # reviewed. Cursor Cloud is a first-class environment here (see the
        # `cursor/…` reserved branch prefix and the Cloud instructions in
        # AGENTS.md), so allow that bot to be reviewed like any human push. The
        # reviewer's job still holds only read scopes; nothing about the trust
        # boundary changes by reviewing a cursor-authored diff.
        #
        # `github-actions` is the release Pull Request: the release workflow
        # opens it as `github-actions[bot]`, and both v1.0.0 (#863) and v1.1.0
        # (#923) got "no verdict" for it — on the one diff shape the golden set
        # already knows the reviewer can miss (a version bump that leaves the
        # generated client stale). The actor name is not the guard: a push made
        # with any workflow's GITHUB_TOKEN, a fork's included, is attributed to
        # github-actions[bot]. What bounds the grant is that a fork's
        # pull_request run gets no repository secrets, so the preflight skips
        # before this action runs, and Publish Review refuses a cross-repository
        # Pull Request (same_repo). Here, release-pr.yml is the only workflow
        # that opens a Pull Request, on a push to release/v* — asserted by
        # tools/scripts/lib/review-tier-workflow.test.mjs.
        allowed_bots: cursor,github-actions
        prompt: |
          /code-review

          You are running in CI (see "In CI" in the skill). Facts for this run:
          - fixed point (base): ${{ inputs.base }}
          - head: ${{ inputs.head }}
          - branch name: ${{ inputs.head-ref }}
          - tier: ${{ inputs.tier }}
          ${{ inputs.facts }}
          - your first tool call is one Read of tmp/code-review/spec.json: it gives you the spec reference the Spec dispatch needs and says whether there is a Spec axis. Your second action is to dispatch both sub-agents (the skill's step 3) — before you read CODING_STANDARDS.md, walk the tree for nested AGENTS.md files, or do any other exploration of your own. Both calls go in the SAME message so they still run in parallel. A run cut short after that message still has two axes' worth of findings to assemble into a report (step 5); a run cut short before it has nothing to write, which is the whole reason this comes first.
          - each dispatch message is the skill's fixed template with its placeholders filled in, and nothing else. Do not paste or paraphrase the brief, the finding contract, or the rule catalogue, do not name the rules or files you expect to matter, and do not add guidance of your own: each sub-agent reads its own brief file.
          - obligations: the worklist for this diff is already selected in tmp/code-review/obligations.json. Read it, answer every site as the skill's step 4 says, and write tmp/code-review/obligations.answers.json. Every field an entry lists in citedFields carries a citation — the file, the line, and the literal text at that line, read from the tree at head — and the check compares that quotation to the tree: a quotation that does not match fails the pipeline check, as does an answer meeting its own defectWhen while raising no finding. Neither is a finding; both are facts about you. An empty "selected" array means nothing fired; write no answer sheet and move on. Do not re-run the selector. Do this after the sub-agents are dispatched, not before: if you are running low on turns when you get to this step, skip it and go straight to step 5 with what the sub-agents already returned — an unanswered obligation fails nothing, but a report you never write is silence.
          - spec: already resolved in tmp/code-review/spec.json, which you read first (above). Do not fetch issues, do not ask anyone. If its spec.kind is "none", skip the Spec axis.
          - write the envelope to exactly tmp/code-review/report.json (this path, not <head>.report.json) with the Write tool, never with a shell redirect, which is refused, and run the validator on it as the skill says. Do not run the renderer and do not post anything: a later step publishes.
          - the model id to record in the envelope: ${{ inputs.model }}
          - your run ends the moment you reply without calling a tool, and no background notification ever reaches you here. Invoke each sub-agent with the Agent tool's `subagent_type: general-purpose` and `run_in_background: false` (both calls in one message so they still run in parallel); the results come back in that same turn. No other agent type will do: several of the types this session offers have no shell and cannot run the diff. Never reply "waiting", never schedule a wake-up, and do not stop until tmp/code-review/report.json exists and the validator has run on it. A run that ends without that file is a rejected report and a failed check.
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns 80
          --allowedTools "Read,Glob,Grep,Edit(/tmp/code-review/**),Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git grep:*),Bash(git blame:*),Bash(git worktree add:*),Bash(git worktree list:*),Bash(corepack yarn nx test:*),Bash(corepack yarn nx lint:*),Bash(corepack yarn nx typecheck:*),Bash(corepack yarn nx show:*),Bash(corepack yarn review:validate:*),Bash(yarn nx test:*),Bash(yarn nx lint:*),Bash(yarn nx typecheck:*),Bash(node:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(echo:*),Bash(rm -f tmp/code-review/*)"

    # A reviewer stopped by the five-hour subscription window produces no
    # report, which is indistinguishable from a reviewer that read the diff and
    # found nothing — and the golden set scores the second as a miss. That
    # mistake was made once already: the whole of run 34176461268 was read as
    # `0 of 7` recall when in fact every one of its seven sessions was cut off,
    # three before their first turn. The transcript says which happened, so
    # read it here rather than leaving it to whoever opens the artifact.
    - name: Detect a rate-limit lockout or a prevented measurement
      id: limits
      if: always() && steps.reviewer.outputs.execution_file != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
        TOOLING: ${{ inputs.tooling-dir }}
      run: |
        # The judgments live in the script, where fixture transcripts test
        # them (`yarn review:test`): the accounting, the three-answer
        # rate-limit reading, the turn ceiling, and `prevented`.
        #
        # Turn exhaustion is a third outcome, and until run 45 the apparatus
        # had no word for it: groceries-blob-type-without-fanouts stopped at
        # error_max_turns with 26 permission denials, the detector correctly
        # said rate_limited=false, and the job fell through to "no valid
        # report" - indistinguishable from a miss. ADR 0072 demotes a guard
        # case on one miss, so that silence would have demoted a case the
        # reviewer never failed: the same error the rate-limit rule exists to
        # prevent, through a different door.
        #
        # Run 35716439899 came through a fourth: it ended `success`, so
        # nothing above applied, having been refused six writes to its own
        # report and answer sheet. A refused write to a required output is
        # prevented whatever the run's subtype (issue #880).
        node "$TOOLING/tools/scripts/review/classify-reviewer-run.mjs" "$EXECUTION_FILE"

    # The action hides the reviewer's transcript from the log. Keep it as a
    # short-lived artifact so a run that wrote no report can be read.
    - name: Keep the reviewer transcript
      if: steps.reviewer.outputs.execution_file != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.transcript-artifact }}
        path: ${{ steps.reviewer.outputs.execution_file }}
        retention-days: 7

    # What the report says about its own run is read from the transcript, not
    # taken from the reviewer (ADR 0123): which standards documents the
    # Standards sub-agent opened, which commands the sub-agents ran, how long
    # the session took, which model ran it. CI run 37576528356 listed four
    # standards sources having opened none, and nothing compared the list to
    # anything.
    #
    # The file goes outside the workspace, where the reviewer's session could
    # not have written it, and it is written whether or not there is a
    # transcript: a missing one is recorded as an unknown shape, so the
    # validator never falls back to the reviewer's own claims. The step
    # reports and fails nothing. What a fact costs is the validator's to
    # decide, from this file (tools/scripts/review/run-ladder.mjs).
    #
    # The index is the workspace's own, which is the reviewed head here and
    # the case head in a golden replay (ADR 0102).
    - name: Read the run facts from the transcript
      id: facts
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
        TOOLING: ${{ inputs.tooling-dir }}
      run: |
        FACTS="$RUNNER_TEMP/run-facts.json"
        echo "facts_file=$FACTS" >> "$GITHUB_OUTPUT"
        node "$TOOLING/tools/scripts/review/read-transcript-facts.mjs" "${EXECUTION_FILE:-}" \
          --index CODING_STANDARDS.md --out "$FACTS"

    # The script, not the model, decides whether the report stands. The
    # caller's tier overrides whatever the envelope says (ADR 0070 item 3),
    # and the run facts override the envelope fields that are facts about
    # the run (ADR 0123).
    #
    # The validator also judges the run against those facts. A run fact that
    # fails "Agent Review Ran" — no sub-agent read an axis's brief, or a
    # reported finding is not one a sub-agent returned — does not reject the
    # report: it is written to `runFacts.failures` in the normalized file,
    # and the caller fails its check from there, so the findings are still
    # published. `--worklist` is how the validator knows which findings the
    # main agent was meant to write itself (an obligation finding); a path
    # that does not exist is a run with no worklist.
    - name: Validate the report
      id: validate
      shell: bash
      env:
        VALIDATOR: ${{ inputs.tooling-dir }}/tools/scripts/review/validate-review-report.mjs
        FACTS: ${{ steps.facts.outputs.facts_file }}
      run: |
        set +e
        REJECTED="$RUNNER_TEMP/rejected.txt"
        echo "rejected_file=$REJECTED" >> "$GITHUB_OUTPUT"
        # Accept the skill's interactive name too, in case the reviewer
        # followed step 5 rather than the prompt.
        if [ ! -f tmp/code-review/report.json ]; then
          candidate="$(ls tmp/code-review/*.report.json 2>/dev/null | head -1 || true)"
          if [ -n "$candidate" ]; then
            echo "using $candidate"
            mv "$candidate" tmp/code-review/report.json
          fi
        fi
        if [ ! -f tmp/code-review/report.json ]; then
          echo "the reviewer wrote no tmp/code-review/report.json (reviewer step outcome: ${{ steps.reviewer.outcome }}; see the run log or the transcript artifact)" | tee "$REJECTED"
          echo 'validated=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ '${{ inputs.tier }}' = 'null' ]; then
          node "$VALIDATOR" tmp/code-review/report.json --facts "$FACTS" --worklist tmp/code-review/obligations.json --out tmp/code-review/normalized.json 2> >(tee "$REJECTED" >&2)
        else
          node "$VALIDATOR" tmp/code-review/report.json --tier '${{ inputs.tier }}' --facts "$FACTS" --worklist tmp/code-review/obligations.json --out tmp/code-review/normalized.json 2> >(tee "$REJECTED" >&2)
        fi
        if [ -f tmp/code-review/normalized.json ]; then
          echo 'validated=true' >> "$GITHUB_OUTPUT"
        else
          echo 'validated=false' >> "$GITHUB_OUTPUT"
        fi
