name: Golden Replay

# Replays the code reviewer against the golden set (ADR 0071, Consequences):
# commit ranges from this repository's own history in which a documented
# incident was merged, and the finding a reviewer should have raised, or
# (issue #933) a known-good merged pull request the reviewer must stay quiet
# on. One reviewer run per case; the job named "Golden Replay" fails when any
# pattern case's recall falls below its minimum or any clean case draws a
# Blocking finding.
#
# When it runs is ADR 0109, which replaced a pull_request path filter that
# bought 88% of three weeks' replay spend on pushes nobody asked to measure:
#
#   - schedule: weekly on main, and only when a reviewer input moved — the
#     frontier tier when one moved that week, every case in the first week of
#     a month in which one moved (golden-tiers.mjs --scheduled decides). Each
#     frontier case runs three times, so one run's randomness decides nothing
#     (ADR 0116); a guard runs once.
#   - the `golden-replay` Request Label on a Pull Request: measures that
#     Pull Request's reviewer before it merges. A button, like agent-review:
#     the workflow removes it when the run ends. Guards run too when the brief
#     or the finding contract changed in that Pull Request (ADR 0072 item 1).
#   - workflow_dispatch: a tier on demand, one repetition per dispatch.
#
# A case's tier is where its last ten scored runs in
# docs/review/golden-replay-results.jsonl put it, and its declared tier until
# the record holds ten (ADR 0116).
#
# The reviewer step is the composite action at .github/actions/code-reviewer,
# shared with code-review.yml. Same credential rules; CODE_REVIEW_ENABLED=false
# stops the replay too.

on:
  pull_request:
    types: [labeled]
  # Mondays 03:00 UTC, clear of the maintainer's working window.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to replay.
        type: choice
        options: [frontier, guard, all]
        default: all
      # A bake-off is a deliberate, dispatch-only experiment. Without this the
      # only way to replay on another model is the CODE_REVIEW_MODEL repository
      # variable, which would also switch every per-PR review — a standing cost
      # change to answer a one-off question. The default keeps the variable in
      # charge of everything that runs by itself.
      model:
        description: Model id for this replay only. Empty uses CODE_REVIEW_MODEL.
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  actions: read

# Every label reaches this workflow, and a run's concurrency group is decided
# before any job if: is read. A label other than golden-replay is sent to a
# group of its own, or adding `bug` would cancel a replay in flight — the
# failure review:concurrency:check exists for on the Code Review workflow.
concurrency:
  group: golden-replay-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'golden-replay' && format('-inert-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  cases:
    name: Golden cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A label other than the Request Label is not a request.
    if: github.event_name != 'pull_request' || github.event.label.name == 'golden-replay'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      has_key: ${{ steps.list.outputs.has_key }}
      # Computed once, here, rather than per matrix job in `replay`: cases
      # run one at a time (max-parallel: 1) and a `tier: all` dispatch can
      # span hours, so one date per job would let two records sharing one
      # run_id disagree if the run crossed UTC midnight — which
      # golden-results.mjs's groupRuns() reads as a corrupted file, not a
      # slow run (issue #932).
      date: ${{ steps.list.outputs.date }}
    steps:
      # Full history: the schedule reads a month of the reviewer inputs' log.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Which tiers this run replays (ADR 0072, ADR 0109).
      #
      # By hand: the tier asked for. On the schedule: golden-tiers.mjs reads
      # the reviewer inputs' history and names a tier, or none when the
      # reviewer did not move. On the Request Label: a guard case is one the
      # reviewer catches reliably, so it runs only when the Pull Request
      # changes the brief or the finding contract, which are what could
      # silently undo the instruction it protects; frontier cases always run.
      - name: Choose the tiers
        id: tiers
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TIER: ${{ inputs.tier }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            echo "tiers=$DISPATCH_TIER" >> "$GITHUB_OUTPUT"
            echo "run by hand: $DISPATCH_TIER"
            exit 0
          fi
          if [ "$EVENT" = 'schedule' ]; then
            TIER="$(node tools/scripts/review/golden-tiers.mjs --scheduled)"
            echo "tiers=${TIER:-none}" >> "$GITHUB_OUTPUT"
            echo "scheduled: ${TIER:-no reviewer input moved, nothing to measure}"
            exit 0
          fi
          CHANGED="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --paginate --jq '.[].filename')"
          # The brief the guards protect, and the contract that decides
          # whether a finding of theirs is even accepted — which since issue
          # #724 includes the rule catalogue: a finding naming an id the
          # catalogue does not carry is rejected exactly as a bad severity is,
          # so narrowing an axis or retiring an id can turn a guard's catch
          # into a rejected report.
          if grep -qE '^(\.agents/skills/code-review/|\.github/actions/code-reviewer/|tools/config/review-rules\.json$|tools/scripts/review/(schema|rules|validate-review-report)\.mjs$)' <<<"$CHANGED"; then
            echo 'tiers=all' >> "$GITHUB_OUTPUT"
            echo 'the brief or the finding contract changed: guards run too'
          else
            echo 'tiers=frontier' >> "$GITHUB_OUTPUT"
            echo 'neither the brief nor the finding contract changed: frontier only'
          fi

      - name: List the cases
        id: list
        env:
          HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          ENABLED: ${{ vars.CODE_REVIEW_ENABLED }}
          TIERS: ${{ steps.tiers.outputs.tiers }}
          EVENT: ${{ github.event_name }}
          MODEL: ${{ inputs.model || vars.CODE_REVIEW_MODEL || 'claude-sonnet-5' }}
        run: |
          set -euo pipefail
          # One date for every case this run replays, computed once before
          # any case starts (issue #932) — see the `date` job output above.
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

          skip() {
            echo 'has_key=false' >> "$GITHUB_OUTPUT"
            { echo '## Golden replay skipped'; echo; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"
            echo "$1"
            exit 0
          }

          # The schedule found no reviewer input that moved. An empty matrix
          # would fail the replay job's strategy, so stop before building one.
          if [ "$TIERS" = 'none' ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            skip 'No reviewer input changed since the last scheduled window, so there is nothing new to measure (ADR 0109).'
          fi

          # golden-tiers.mjs, not the scorer: this job installs nothing, and
          # the scorer reaches schema.mjs, which imports zod. That script is
          # dependency-free for exactly this reason, and it is the only
          # implementation of the tier filter — the scorer's `--list --tier`
          # calls the same function, so the two cannot drift apart.
          #
          # --matrix prints one {case, repetition} entry per reviewer session:
          # three per frontier case on the schedule, one otherwise (ADR 0116).
          # The event is passed rather than read by the script, so the number
          # of sessions a run buys is visible in the line that asks for them.
          MATRIX="$(node tools/scripts/review/golden-tiers.mjs --matrix --tier "$TIERS" --event "$EVENT")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "tier $TIERS: $MATRIX"

          # The same off switch as code-review.yml: CODE_REVIEW_ENABLED=false
          # stops the replay too, which matters at roughly one reviewer run
          # per case.
          if [ "${ENABLED:-true}" = 'false' ]; then
            skip 'The CODE_REVIEW_ENABLED repository variable is false.'
          fi

          if [ "$MATRIX" = '[]' ]; then
            skip "No case is in tier \`$TIERS\`."
          fi

          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
          # Which model ran is the first thing a result row needs and the one
          # thing the run page does not otherwise say.
          {
            echo '## Golden replay'
            echo
            echo "Tier \`$TIERS\`, model \`$MODEL\`, $(jq '[.[].case] | unique | length' <<<"$MATRIX") case(s), $(jq 'length' <<<"$MATRIX") reviewer session(s)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_KEY" != 'true' ]; then
            {
              echo '## Golden replay skipped'
              echo
              echo 'Neither `CLAUDE_CODE_OAUTH_TOKEN` nor `ANTHROPIC_API_KEY` is set as a repository secret, so no case was replayed.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  replay:
    name: Replay ${{ matrix.case }} (${{ matrix.repetition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: cases
    if: needs.cases.outputs.has_key == 'true'
    strategy:
      fail-fast: false
      # One reviewer session per case, and a push that reaches this workflow
      # also runs code-review.yml. Eight at once exceeded the subscription's
      # session limit and lost a whole run to failures in under a minute
      # (docs/research/2026-09-07-golden-replay-baseline.md, Limits). Four
      # still locked the maintainer out of their own session for the rest of
      # the five-hour window (docs/review/golden-replay-results.md, "What it
      # does measure: the budget"; run 34176461268). A replay competes with
      # the maintainer for the same token, on the same window, so it does not
      # get to spend it on its own schedule: cases now run one at a time, and
      # ADR 0072's amendment moves the second and third repetition of a
      # dispatched measurement to separate dispatches on separate days. The
      # schedule is the exception (ADR 0116): it runs a frontier case's three
      # repetitions in one run, still one session at a time, at 03:00 UTC on
      # a Monday, when nobody is waiting on the window.
      max-parallel: 1
      matrix:
        # One {case, repetition} entry per reviewer session, from
        # golden-tiers.mjs --matrix.
        include: ${{ fromJSON(needs.cases.outputs.matrix) }}
    env:
      # Required for Prisma v7 config loading if a reviewer runs backend tests.
      DATABASE_URL: postgresql://localhost:5432/myorganizer
      # One source for the model id this job runs, shared by the reviewer
      # call below and by "Record the result" (issue #932), so the results
      # record can never disagree with what actually ran.
      MODEL: ${{ inputs.model || vars.CODE_REVIEW_MODEL || 'claude-sonnet-5' }}
    steps:
      # The Pull Request head, for the tooling: today's skill and scripts
      # review yesterday's range. Full history so both ends of the case exist.
      # This is not the tree the reviewer reads — see "Put the reviewer in the
      # case tree" below.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Load the case
        id: case
        run: |
          CASE="$(node tools/scripts/review/score-golden-case.mjs --show '${{ matrix.case }}')"
          echo "base=$(jq -r .base <<<"$CASE")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head <<<"$CASE")" >> "$GITHUB_OUTPUT"
          mkdir -p tmp/code-review
          jq '{spec: .spec}' <<<"$CASE" > tmp/code-review/spec.json
          echo "replaying $(jq -r .incident <<<"$CASE"): $(jq -r .base <<<"$CASE" | cut -c1-7)...$(jq -r .head <<<"$CASE" | cut -c1-7)"

      # The reviewer reads the case, not the pull request (ADR 0102). Run
      # 35833576958 read `.github/workflows/ci.yml` from this checkout,
      # answered that `openapi:check` was wired at a head where it was not,
      # and suppressed the finding it was there to raise; it also listed an
      # ADR written a month after the range as a standard the range was held
      # to. Every file the reviewer reads without naming a commit — Read,
      # Grep, Glob, a gate run for executed evidence — now comes from the case
      # head, standards documents included: in production the standards and
      # the code are one tree, and the replay has the same shape.
      #
      # Only the reviewer's harness is laid over it from the pull request,
      # because that is what is being measured: the skill, `.claude` (the
      # permission rules the session loads, ADR 0099, and the skills link),
      # the hook scripts those settings run by cwd-relative path and the
      # upstream-brief module they import, and this job's own composite
      # action, which the next step `uses:` from the workspace. The scripts
      # the harness runs — selector, validator, obligation-answer check,
      # scorer — are extracted outside the workspace, where no Read or Grep
      # of the reviewer's lands on them, and resolve their modules through
      # the one node_modules installed above. Nothing is committed: this
      # runner is discarded with the tree.
      - name: Put the reviewer in the case tree
        id: tree
        env:
          CASE_BASE: ${{ steps.case.outputs.base }}
          CASE_HEAD: ${{ steps.case.outputs.head }}
          TOOLING: ${{ runner.temp }}/review-tooling
        run: |
          set -euo pipefail
          OVERLAY=(.agents/skills/code-review .agents/skills/upstream-brief .claude tools/scripts/copilot-hooks .github/actions/code-reviewer)
          TOOLING_HEAD="$(git rev-parse HEAD)"
          mkdir -p "$TOOLING"
          git archive "$TOOLING_HEAD" tools/scripts/review tools/scripts/lib tools/scripts/check-review-obligation-answers.mjs tools/config | tar -x -C "$TOOLING"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$TOOLING/node_modules"
          git checkout --quiet --detach "$CASE_HEAD"
          rm -rf "${OVERLAY[@]}"
          git checkout --quiet "$TOOLING_HEAD" -- "${OVERLAY[@]}"
          echo "tooling=$TOOLING" >> "$GITHUB_OUTPUT"
          # The reviewer's facts name these paths from this output, so the
          # list the prompt states is the list that was laid over the tree.
          echo "overlay=$(printf '`%s` ' "${OVERLAY[@]}")" >> "$GITHUB_OUTPUT"
          echo "reviewer tree: case head $(git rev-parse --short "$CASE_HEAD"), overlaid from $(git rev-parse --short "$TOOLING_HEAD"): ${OVERLAY[*]}"
          # A case whose own diff touches an overlaid path is reviewed with
          # the pull request's copy of that path on disk. Say so where the
          # result is read; the facts below tell the reviewer to read those
          # paths at the head by commit.
          TOUCHED="$(git diff --name-only "$CASE_BASE...$CASE_HEAD" -- "${OVERLAY[@]}")"
          if [ -n "$TOUCHED" ]; then
            echo "::warning::this case's diff touches paths overlaid from the pull request, so the disk copy of them is not the case's: $(tr '\n' ' ' <<<"$TOUCHED")"
          fi

      # The reviewer, the transcript artifact, and the validation, with no
      # tier: a historical range has none. See .github/actions/code-reviewer.
      - name: Run the reviewer
        id: reviewer
        uses: ./.github/actions/code-reviewer
        with:
          base: ${{ steps.case.outputs.base }}
          head: ${{ steps.case.outputs.head }}
          head-ref: none (historical range)
          tier: 'null'
          tooling-dir: ${{ steps.tree.outputs.tooling }}
          facts: |
            - this is a replay of a historical range, and the working tree IS its head (detached): read, grep, and run gates in it directly, and `git worktree add tmp/code-review/worktree HEAD` for a throwaway reproduction as the skill says, leaving it in place — this runner is ephemeral, while removing it is refused (ADR 0099). The standards sources are this tree's, as of the head: a document the head does not contain is not a standard this range could have broken, so do not go looking for later ones.
            - these paths on disk are the reviewing pull request's, not the head's: ${{ steps.tree.outputs.overlay }}. They are your harness, not the subject. If the diff touches one, read it with `git show <head>:<path>`.
            - run the validator as `node ${{ steps.tree.outputs.tooling }}/tools/scripts/review/validate-review-report.mjs tmp/code-review/report.json --out tmp/code-review/normalized.json` instead of `corepack yarn review:validate`: this head's package.json predates the `review:*` scripts. That directory is tooling, not the tree under review; do not read it for anything else.
            - tier is null: write `"tier": null` in the envelope
          model: ${{ env.MODEL }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          transcript-artifact: golden-transcript-${{ matrix.case }}-r${{ matrix.repetition }}

      # A case that never finished is not a result. It has to fail — there is
      # no report to score — but it must never be written into the record as a
      # miss, because nothing about the reviewer was measured. Three ways to
      # not finish: the subscription rate limit, the turn ceiling on a
      # genuinely hard case, and the harness refusing a permission the
      # reviewer's own instructions told it to use — a prevented measurement,
      # and the only one of the three that is a bug someone can fix. Run 45
      # hit the second on the guard case and the message below said only "no
      # valid report", which reads exactly like a miss and would have demoted
      # a tier under ADR 0072. Run 35716439899 was prevented without reaching
      # the ceiling at all: it ended cleanly, refused every write to its own
      # report path, and got the same "no valid report" (issue #880).
      #
      # A validated report is checked first and wins outright: dispatching
      # both axes before the reviewer's own exploration (the skill's step 3)
      # means a run cut short partway through often still wrote one, and that
      # partial report is scored below like any other, not discarded because
      # the run also hit a ceiling or a lockout along the way.
      - name: Require a validated report
        run: |
          if [ '${{ steps.reviewer.outputs.validated }}' = 'true' ]; then
            echo "case ${{ matrix.case }}: a report was written; scoring it as usual"
            exit 0
          fi
          if [ '${{ steps.reviewer.outputs.prevented }}' = 'true' ]; then
            echo "::error::case ${{ matrix.case }} was refused a permission its own instructions told it to use — at the turn ceiling, or on a write to its own report or answer sheet (the reviewer step's annotation says which); this is a prevented measurement, not a miss — fix the allowlist or the instructions, not the case"
            exit 1
          fi
          if [ '${{ steps.reviewer.outputs.turn-exhausted }}' = 'true' ]; then
            echo "::error::case ${{ matrix.case }} hit the turn ceiling and wrote no report; it measured nothing and is not a miss"
            exit 1
          fi
          case '${{ steps.reviewer.outputs.rate-limited }}' in
            true)
              echo "::error::case ${{ matrix.case }} was cut off by the subscription rate limit and measured nothing; do not record it as a miss"
              exit 1 ;;
            unknown)
              echo "::error::case ${{ matrix.case }} produced a transcript that could not be read for rate-limit events, so whether it measured anything is unknown; do not record it as a miss"
              exit 1 ;;
          esac
          echo "::error::no valid report for case ${{ matrix.case }} (reviewer step outcome: ${{ steps.reviewer.outputs.reviewer-outcome }})"
          cat '${{ steps.reviewer.outputs.rejected-file }}' 2>/dev/null || true
          exit 1

      # The obligation answers, checked as code-review.yml checks them
      # (ADR 0078), against the case head the selector recorded in the
      # worklist, read by commit — which is also the checkout now (ADR 0102),
      # so a quotation read from disk matches unless it was made up. A sheet
      # that fails here is one production would have answered by failing
      # Agent Review Ran, so the run is a void, not a miss, and not a catch
      # either (ADR 0101): the score below does not run, and the case fails
      # with a message that says why. Run 35833576958 is the case that bought
      # this — its miss on release-bump-leaves-generated-client-stale rested
      # on a wiredBy citation read from the checkout, and the replay scored it
      # because nothing here compared the quotation to anything.
      #
      # No sheet and no worklist fail nothing, exactly as in production:
      # thoroughness is not a pipeline fact (ADR 0078, Consequences).
      #
      # review:obligations:check's script runs from the extracted tooling,
      # like the selector and the scorer: the case head's package.json has no
      # review:* scripts, and the catalogue it reads is cwd-relative.
      # run-from-tooling gives it the tooling as its working directory and
      # the workspace's repository as its git (ADR 0102).
      - name: Check the obligation answers
        id: obligations-check
        env:
          TOOLING: ${{ steps.tree.outputs.tooling }}
        run: |
          if [ ! -f tmp/code-review/obligations.json ]; then
            echo 'no worklist: nothing to check'; exit 0
          fi
          if [ ! -f tmp/code-review/obligations.answers.json ]; then
            echo 'review-obligations-check: the reviewer wrote no answer sheet'
            exit 0
          fi
          # --report always: the step above already required a validated
          # report, so report.json is there, and it is what production reads
          # to decide whether a self-contradiction raised its finding.
          set +e
          CR="$PWD/tmp/code-review"
          node "$TOOLING/tools/scripts/review/run-from-tooling.mjs" check-review-obligation-answers.mjs \
            "$CR/obligations.json" \
            "$CR/obligations.answers.json" \
            --report "$CR/report.json" \
            --out "$CR/obligations.report.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Recorded before the exit, so "Record the result" (issue #932)
            # can tell this void apart from a rate limit or a turn ceiling
            # without re-running the check.
            echo 'failed=true' >> "$GITHUB_OUTPUT"
            echo "::error::case ${{ matrix.case }}: the obligation answer sheet does not hold up against the case head (review-obligations-check exit $status). Production fails Agent Review Ran on this (ADR 0078), so the run measured nothing: it is a void, not a miss, and was not scored (ADR 0101)"
            exit 1
          fi

      # The run facts the validator judged against the transcript, read from
      # the normalized report as production reads them (ADR 0123 item 7). What
      # fails Agent Review Ran there voids the case here: no sub-agent read an
      # axis's brief, or the report carries a finding no sub-agent returned.
      # Neither measured the reviewer this set exists to measure, so the score
      # below does not run. What only tightens a tier in production (the index
      # never opened, a dispatch off the template, a transcript nobody could
      # read) is scored as usual and recorded on the result line: a miss from
      # a reviewer that skipped the index is a real miss, and voiding it would
      # hide the regression.
      - name: Check the run against its transcript
        id: run-facts
        run: |
          REASON="$(jq -r '.runFacts.failures // [] | .[0].reason // empty' tmp/code-review/normalized.json)"
          if [ -n "$REASON" ]; then
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            jq -r '.runFacts.failures[] | "\(.reason): \(.detail)"' tmp/code-review/normalized.json
            echo "::error::case ${{ matrix.case }}: the review did not run as built ($REASON). Production fails Agent Review Ran on this (ADR 0123), so the run measured nothing: it is a void, not a miss, and was not scored (ADR 0101)"
            exit 1
          fi

      # Recall against the case's expected findings for a pattern case, or
      # (issue #933) whether the report carries a Blocking finding for a
      # clean case; either way a failure names why in the summary. Never
      # `always()`: after a failed answer sheet this must not run, or a void
      # is written into the summary as a miss.
      #
      # From the extracted tooling (review:golden:score's script), whose
      # golden set is the pull request's: the workspace is the case head now,
      # and its package.json and set predate this one (ADR 0102).
      - name: Score the case
        id: score
        working-directory: ${{ steps.tree.outputs.tooling }}
        run: |
          node tools/scripts/review/score-golden-case.mjs --case '${{ matrix.case }}' \
            --normalized "$GITHUB_WORKSPACE/tmp/code-review/normalized.json" \
            --out "$GITHUB_WORKSPACE/tmp/code-review/score.json"

      # One line for this case, appended to the run's results record
      # regardless of how the case ended, so a void is recorded as a void
      # and never silently dropped or read as a miss (issue #932, ADR 0101).
      # `if: always()` and no re-scoring: every fact it needs already exists
      # in a prior step's output or in score.json, in the same precedence
      # "Require a validated report" already used to write its own message.
      #
      # Branches on whether score.json exists, never on steps.score.outcome:
      # score-golden-case.mjs writes score.json before it exits, but it
      # exits 1 on an ordinary miss (recall below minimum, or a Blocking
      # finding on a clean case) same as on an inability to score, so the
      # step's own outcome is `failure` on a miss too — reading that as void
      # would read every miss as a void and defeat the tier mechanism ADR
      # 0072 and ADR 0101 both rest on a truthful miss/void distinction for.
      - name: Record the result
        id: record
        if: always()
        working-directory: ${{ steps.tree.outputs.tooling }}
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          CASE: ${{ matrix.case }}
          OBLIGATIONS_FAILED: ${{ steps.obligations-check.outputs.failed }}
          RUN_FAILURE: ${{ steps.run-facts.outputs.reason }}
          PREVENTED: ${{ steps.reviewer.outputs.prevented }}
          TURN_EXHAUSTED: ${{ steps.reviewer.outputs.turn-exhausted }}
          RATE_LIMITED: ${{ steps.reviewer.outputs.rate-limited }}
          TOTAL_COST_USD: ${{ steps.reviewer.outputs.total-cost-usd }}
          TURNS: ${{ steps.reviewer.outputs.turns }}
          SCORE_FILE: ${{ github.workspace }}/tmp/code-review/score.json
          OUT_FILE: ${{ github.workspace }}/tmp/code-review/golden-results.jsonl
        run: |
          set -euo pipefail
          ARGS=(--out "$OUT_FILE" --date "${{ needs.cases.outputs.date }}" --run-id "$RUN_ID" \
            --commit "$COMMIT" --case "$CASE" --model "$MODEL")
          if [ -f "$SCORE_FILE" ]; then
            PASS="$(jq -r '.pass' "$SCORE_FILE")"
            # A clean case (issue #933) carries its own outcome field —
            # clean-pass or clean-fail — and no .recall: it is scored on
            # whether a Blocking finding appeared, not a match count, and
            # record-golden-result.mjs refuses a recall on either outcome.
            # score.json for a pattern case has no .outcome field at all, so
            # this is empty there and the branch below still runs.
            CLEAN_OUTCOME="$(jq -r '.outcome // empty' "$SCORE_FILE")"
            if [ "$CLEAN_OUTCOME" = 'clean-pass' ] || [ "$CLEAN_OUTCOME" = 'clean-fail' ]; then
              ARGS+=(--outcome "$CLEAN_OUTCOME")
            elif [ "$PASS" = 'true' ]; then
              ARGS+=(--outcome caught --recall "$(jq -r '.recall' "$SCORE_FILE")")
            else
              ARGS+=(--outcome missed --recall "$(jq -r '.recall' "$SCORE_FILE")")
            fi
          else
            ARGS+=(--outcome void)
            if [ "$OBLIGATIONS_FAILED" = 'true' ]; then
              ARGS+=(--void-reason answer-sheet-check-failed)
            elif [ -n "${RUN_FAILURE:-}" ]; then
              # brief-not-read or finding-not-returned, as the validator
              # named it; record-golden-result.mjs refuses any other word.
              ARGS+=(--void-reason "$RUN_FAILURE")
            elif [ "$PREVENTED" = 'true' ]; then
              ARGS+=(--void-reason prevented)
            elif [ "$TURN_EXHAUSTED" = 'true' ]; then
              ARGS+=(--void-reason turn-ceiling)
            elif [ "$RATE_LIMITED" = 'true' ] || [ "$RATE_LIMITED" = 'unknown' ]; then
              ARGS+=(--void-reason rate-limit)
            else
              ARGS+=(--void-reason unknown)
            fi
          fi
          if [ -n "${TOTAL_COST_USD:-}" ]; then ARGS+=(--total-cost-usd "$TOTAL_COST_USD"); fi
          if [ -n "${TURNS:-}" ]; then ARGS+=(--turns "$TURNS"); fi
          # The CLI version and the three tightening facts ride on every
          # line that has a validated report to read them from, voids
          # included; a case with no report records them as null.
          ARGS+=(--normalized "$GITHUB_WORKSPACE/tmp/code-review/normalized.json")
          node tools/scripts/review/record-golden-result.mjs "${ARGS[@]}"

      # The obligation files ride along with the report. Run 45 asked whether a
      # miss on a case whose obligation fired was answered-and-wrong or never
      # answered at all - opposite diagnoses, one indicting the question's
      # wording and the other its enforcement - and the answer was not
      # collectable, because only normalized.json and score.json were kept.
      # code-review.yml had carried these three since c6f7117c; the replay,
      # which is where the measurement actually happens, had not.
      #
      # golden-results.jsonl rides along too (issue #932): every run uploads
      # its case's result line as an artifact; only a scheduled run also
      # commits it to docs/review/golden-replay-results.jsonl, in the
      # "Record golden replay results" job below.
      - name: Keep the report, the score, and the obligations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # The repetition is in the name: a case's three scheduled runs
          # would otherwise upload under one name and all but the first
          # result line would be refused.
          name: golden-${{ matrix.case }}-r${{ matrix.repetition }}
          path: |
            tmp/code-review/normalized.json
            tmp/code-review/score.json
            tmp/code-review/obligations.json
            tmp/code-review/obligations.answers.json
            tmp/code-review/obligations.report.json
            tmp/code-review/golden-results.jsonl
          if-no-files-found: ignore
          retention-days: 30

  verdict:
    name: Golden Replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [cases, replay]
    # A label other than golden-replay skipped the cases job; that is not a
    # run that failed to measure, so this check does not report one.
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'golden-replay')
    steps:
      - name: Combine
        run: |
          echo "cases: ${{ needs.cases.result }}; replay: ${{ needs.replay.result }}"
          # A job that decided to skip and a job that crashed both leave
          # has_key unset, and only one of them is a pass. Read the job's
          # result first, or a broken matrix step reports this check green.
          if [ '${{ needs.cases.result }}' != 'success' ]; then
            echo '::error::the Golden cases job did not complete; nothing was replayed and nothing was measured'
            exit 1
          fi
          if [ '${{ needs.cases.outputs.has_key }}' != 'true' ]; then
            # Off switch, an unmoved reviewer, an empty tier, or no credential.
            # The Golden cases job's summary says which. None of them is a
            # measurement, so none of them is a failure.
            echo 'nothing replayed; see the Golden cases summary for why'
            exit 0
          fi
          if [ '${{ needs.replay.result }}' != 'success' ]; then
            echo '::error::at least one golden case failed — a pattern case fell below its minimum recall, a clean case (issue #933) drew a Blocking finding, or the run measured nothing (a void: rate limit, turn ceiling, prevented, an answer sheet that failed its check, or a review that did not run as built); see the Replay jobs'
            exit 1
          fi

  # Every run uploads each case's result line as a 30-day artifact (the
  # "Keep the report..." step above); only a scheduled run also commits the
  # accumulated lines to docs/review/golden-replay-results.jsonl, so they
  # outlive that retention window (issue #932). A label or dispatch run
  # already made its point by passing or failing; committing on those too
  # would make every button press a permanent entry for a run nobody asked
  # recorded, so this job is schedule-only, mirroring the same restraint
  # ADR 0109 already applies to when the replay runs at all.
  #
  # `contents: write` sits on this job alone and not on `replay`, which runs
  # the reviewer over an untrusted diff-shaped range (ADR 0071 item 8's
  # reasoning, applied here to a commit rather than a GitHub API token).
  record-results:
    name: Record golden replay results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cases, replay]
    if: always() && github.event_name == 'schedule' && needs.cases.outputs.has_key == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every case run's result line
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: golden-*
          path: tmp/golden-artifacts

      # A case that never wrote a line (the reviewer crashed before "Record
      # the result" could run at all) is silently skipped here rather than
      # failing this job: the `verdict` job above already failed loudly for
      # that case, and this job's purpose is to persist whatever lines exist,
      # not to re-adjudicate a case it never scored.
      - name: Append this run's lines to the results record
        run: |
          set -euo pipefail
          RECORD=docs/review/golden-replay-results.jsonl
          FOUND=0
          shopt -s nullglob
          for f in tmp/golden-artifacts/golden-*/golden-results.jsonl; do
            cat "$f" >> "$RECORD"
            FOUND=1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo 'no case produced a result line this run; nothing to append'
          fi

      # The ledger's Runs section and standing table are generated from the
      # record, and review:golden:results:check fails when they disagree. A
      # record committed alone would fail that check on main, for every pull
      # request, over a drift none of them introduced. The checker imports
      # only Node built-ins, so nothing is installed here.
      - name: Regenerate the ledger from the record
        run: node tools/scripts/check-review-golden-results.mjs --write

      - name: Commit the results record
        run: |
          set -euo pipefail
          RECORD=docs/review/golden-replay-results.jsonl
          LEDGER=docs/review/golden-replay-results.md
          if git diff --quiet -- "$RECORD" "$LEDGER"; then
            echo 'no change to commit'
            exit 0
          fi
          # main may have moved during the hours this replay ran; rebase the
          # two files this job ever touches before pushing.
          git fetch origin main
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              add "$RECORD" "$LEDGER"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(golden-replay): record run ${{ github.run_id }}"
          git rebase origin/main
          git push origin HEAD:main

  # The Request Label is a button: remove it so it can be pressed again. Its
  # own job, because removing a label is a write and no replay job holds one —
  # the reviewer runs in those, and its job token stays read-only (ADR 0071
  # item 8). A fork's token could not remove it anyway, hence the || true.
  reset-label:
    name: Reset the golden-replay label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [cases, replay]
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'golden-replay'
    permissions:
      pull-requests: write
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label golden-replay || true
