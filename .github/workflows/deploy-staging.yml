name: Deploy Staging

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_only:
        description:
          'Re-run Host Apply only, without re-uploading the backend bundle.
          Leave unchecked to run the full pipeline by hand (upload, Host
          Apply, frontend).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare-dependencies:
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.apply_only) }}
    name: Prepare Dependency Cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key:
            ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json',
            '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

  deploy-backend:
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.apply_only) }}
    needs: prepare-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    # Shares `deploy-staging-apply` with host-apply, and never cancels:
    # the upload and the apply touch the same APP_ROOT, so a newer `main`
    # run must queue behind an in-flight apply rather than FTP a new bundle
    # over a tree `npm ci` and `prisma migrate deploy` are still working in.
    concurrency:
      group: deploy-staging-apply
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key:
            ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json',
            '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Package backend (cPanel)
        run: corepack yarn package:backend:api

      - name: Deploy backend to cPanel (staging)
        uses: samkirkland/ftp-deploy-action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/deploy/backend-api/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 300000

  # Applies backend upload (install, migrate, generate, restart) over SSH and
  # verifies with HTTP probes (ADR 0056).
  #
  # Deliberately `workflow_dispatch` only, never the `workflow_run` that
  # follows a green `main`: SSH shell access on this hosting account is a
  # manual toggle that reverts, so an automatic apply would go red on every
  # push where the shell happened to be off. Uploads still land automatically;
  # applying them is an operator action taken with the shell switched on. That
  # makes the Cut checklist's "Staging Host Apply green" load-bearing rather
  # than a formality — nothing else applies a Staging migration now. Amends
  # PRD #565 user story 3.
  #
  # Shares the `deploy-staging-apply` group with deploy-backend, and never
  # cancels in progress: an automatic upload must queue behind an in-flight
  # `prisma migrate deploy` rather than kill it (ADR 0056 "Cancel-in-progress
  # through migrate — rejected") or land a new bundle on top of it. May run
  # beside deploy-frontend, which holds the separate `deploy-staging` group
  # and never touches APP_ROOT.
  host-apply:
    needs: deploy-backend
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (needs.deploy-backend.result == 'success' || inputs.apply_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging-apply
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build Host Apply script
        env:
          APP_ROOT: ${{ secrets.APP_ROOT }}
          COUNTERPART_APP_ROOT: ${{ secrets.COUNTERPART_APP_ROOT }}
          NODEVENV_ACTIVATE: ${{ secrets.NODEVENV_ACTIVATE }}
          SELECTOR_APP_KEY: ${{ secrets.SELECTOR_APP_KEY }}
        run: node tools/scripts/run-host-apply.mjs staging > "$RUNNER_TEMP/host-apply.sh"

      - name: Apply on host over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/host_apply_key"
          known_hosts="$RUNNER_TEMP/host_apply_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key_file" "$known_hosts"
          : > "$RUNNER_TEMP/host-apply.log"
          # The runner is ephemeral, so accept-new would trust whatever key
          # answered, every run. The host keys are pinned as a secret instead.
          # Output is captured rather than streamed: the next step decides
          # whether it may reach this public Actions log.
          status=0
          ssh -i "$key_file" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' \
            < "$RUNNER_TEMP/host-apply.sh" \
            > "$RUNNER_TEMP/host-apply.log" 2>&1 || status=$?
          echo "HOST_APPLY_SSH_STATUS=$status" >> "$GITHUB_ENV"

      - name: Host Apply output (redaction-checked)
        if: always()
        run: node tools/scripts/scrub-host-apply-log.mjs "$RUNNER_TEMP/host-apply.log"

      - name: Fail on a red Host Apply
        if: always()
        run: exit "${HOST_APPLY_SSH_STATUS:-1}"

      - name: Remove SSH key and captured log
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/host_apply_key" \
            "$RUNNER_TEMP/host_apply_known_hosts" \
            "$RUNNER_TEMP/host-apply.sh" \
            "$RUNNER_TEMP/host-apply.log"

      - name: Verify Host Apply (HTTP probes)
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          set -euo pipefail
          docs_status="$(curl -sS -o /dev/null -w '%{http_code}' "$API_ORIGIN/docs")"
          cron_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'X-Cron-Secret: host-apply-verification-wrong-secret' \
            "$API_ORIGIN/api/v1/youtube/cron/sync")"
          node tools/scripts/verify-host-apply.mjs "$docs_status" "$cron_status"

  deploy-frontend:
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.apply_only) }}
    needs: [prepare-dependencies, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key:
            ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json',
            '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Deploy frontend to Vercel (staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # This workflow deploys to a dedicated Vercel staging project.
          # In that project we intentionally use the production environment
          # for the staging app, so `--environment=production` and `--prod`
          # are both expected here.
          # See VERCEL_FRONTEND_HOSTING.md and CI_CD_AND_RELEASE_PROCESS.md.
          #
          # Nx recommends keeping the Vercel project's Root Directory at the
          # workspace root and setting the Build Command to `npx nx build myorganizer --prod`.
          set -euo pipefail
          VERCEL_CLI_VERSION='50.1.1'

          corepack yarn dlx -p "vercel@${VERCEL_CLI_VERSION}" vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

          echo '--- Vercel diagnostics (sanitized) ---'
          if [ -d .vercel ]; then
            echo 'Vercel metadata files (names only):'
            find .vercel -maxdepth 2 -type f -print
          else
            echo 'No .vercel directory found after vercel pull.'
          fi

          node tools/scripts/sync-vercel-project-settings.mjs

          echo 'NOTE: Not printing any .vercel/.env* files to avoid leaking secrets.'
          echo '--- end Vercel diagnostics ---'

          # Avoid `--prebuilt`: prebuilt bundles can fail in monorepos when
          # file-trace references point outside the uploaded artifact set.
          corepack yarn dlx -p "vercel@${VERCEL_CLI_VERSION}" vercel deploy --prod --yes --token "$VERCEL_TOKEN"
