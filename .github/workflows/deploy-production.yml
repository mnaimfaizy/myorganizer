name: Deploy Production (manual)

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to deploy (e.g. release/v0.1.0). Leave empty to auto-select the latest release/* branch.'
        required: false
        type: string
      apply_only:
        description:
          'Re-run Host Apply only, without re-uploading the backend and
          frontend bundles.'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  # Deployments are serialized via concurrency; additional runs queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      release_ref: ${{ steps.select_release_ref.outputs.release_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            exit 0
          fi

          echo 'ERROR: This workflow must be run from a release/* branch due to GitHub Environment protection rules.'
          echo "Current ref: $GITHUB_REF"
          echo "Tip: Use the 'Dispatch Production Deploy (latest release)' workflow to auto-select the newest release branch."
          exit 1

      - name: Select release ref
        id: select_release_ref
        env:
          INPUT_RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail

          git fetch origin --prune

          if [ -n "${INPUT_RELEASE_BRANCH:-}" ]; then
            candidate="${INPUT_RELEASE_BRANCH}"
            if ! git show-ref --verify --quiet "refs/remotes/origin/${candidate}"; then
              echo "ERROR: release_branch '${candidate}' not found on origin."
              exit 1
            fi
            echo "release_ref=${candidate}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto-select the latest origin/release/* branch using version sort.
          # The expected branch format is release/vX.Y.Z.
          latest="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/ \
            | sed 's#^origin/##' \
            | sed -n 's#^release/v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$#release/v\1#p' \
            | sort -V \
            | tail -n 1)"

          if [ -z "${latest}" ]; then
            echo 'ERROR: No release branches found on origin (expected origin/release/vX.Y.Z).'
            exit 1
          fi

          echo "Selected latest release branch: ${latest}"
          echo "release_ref=${latest}" >> "$GITHUB_OUTPUT"

  prepare-dependencies:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    name: Prepare Dependency Cache
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

  deploy-backend:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') && !inputs.apply_only }}
    needs: [validate, prepare-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Package backend (cPanel)
        run: corepack yarn package:backend:api

      - name: Deploy backend to cPanel (production)
        uses: samkirkland/ftp-deploy-action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_PROD_HOST }}
          username: ${{ secrets.FTP_PROD_BACKEND_USERNAME }}
          password: ${{ secrets.FTP_PROD_BACKEND_PASSWORD }}
          local-dir: ./dist/deploy/backend-api/
          server-dir: ${{ secrets.FTP_PROD_BACKEND_DIR }}
          timeout: 300000

  # Applies backend upload (install, migrate, generate, restart) over SSH and
  # verifies with HTTP probes (ADR 0056). Runs only after Deploy Approval on
  # the `production` Environment has already gated `deploy-backend`; a failed
  # Host Apply fails this workflow with no rollback and no Tag.
  host-apply:
    needs: [validate, deploy-backend]
    if: ${{ always() && needs.validate.result == 'success' && startsWith(github.ref, 'refs/heads/release/') && (needs.deploy-backend.result == 'success' || inputs.apply_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build Host Apply script
        env:
          APP_ROOT: ${{ secrets.APP_ROOT }}
          COUNTERPART_APP_ROOT: ${{ secrets.COUNTERPART_APP_ROOT }}
          NODEVENV_ACTIVATE: ${{ secrets.NODEVENV_ACTIVATE }}
          SELECTOR_APP_KEY: ${{ secrets.SELECTOR_APP_KEY }}
        run: node tools/scripts/run-host-apply.mjs production > "$RUNNER_TEMP/host-apply.sh"

      - name: Apply on host over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/host_apply_key"
          known_hosts="$RUNNER_TEMP/host_apply_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key_file" "$known_hosts"
          # Say which secret is wrong, before ssh reports it as
          # `error in libcrypto` followed by a bare `Permission denied`, which
          # reads like the key was rejected rather than never parsed.
          # `ssh-keygen -y` prints only the public half, and only to /dev/null.
          if [ "$(wc -c < "$key_file")" -le 1 ]; then
            echo "host-apply: SSH_PRIVATE_KEY is empty." >&2
            echo "  Set it on this Environment specifically - a repository-level" >&2
            echo "  secret of the same name is not visible here." >&2
            exit 1
          fi
          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo "host-apply: SSH_PRIVATE_KEY did not parse as a private key." >&2
            echo "  It is truncated, or lost its line breaks on paste. Copy the" >&2
            echo "  file verbatim (macOS: pbcopy < ~/.ssh/<key>) and re-save it." >&2
            exit 1
          fi
          if [ "$(wc -c < "$known_hosts")" -le 1 ]; then
            echo "host-apply: SSH_KNOWN_HOSTS is empty." >&2
            echo "  StrictHostKeyChecking=yes has nothing to verify against." >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/host-apply.log"
          # The runner is ephemeral, so accept-new would trust whatever key
          # answered, every run. The host keys are pinned as a secret instead.
          # Output is captured rather than streamed: the next step decides
          # whether it may reach this public Actions log.
          status=0
          ssh -i "$key_file" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' \
            < "$RUNNER_TEMP/host-apply.sh" \
            > "$RUNNER_TEMP/host-apply.log" 2>&1 || status=$?
          echo "HOST_APPLY_SSH_STATUS=$status" >> "$GITHUB_ENV"

      - name: Host Apply output (redaction-checked)
        if: always()
        run: node tools/scripts/scrub-host-apply-log.mjs "$RUNNER_TEMP/host-apply.log"

      - name: Fail on a red Host Apply
        if: always()
        run: exit "${HOST_APPLY_SSH_STATUS:-1}"

      - name: Remove SSH key and captured log
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/host_apply_key" \
            "$RUNNER_TEMP/host_apply_known_hosts" \
            "$RUNNER_TEMP/host-apply.sh" \
            "$RUNNER_TEMP/host-apply.log"

      - name: Verify Host Apply (HTTP probes)
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          set -euo pipefail
          # -L: swagger-ui-express answers /docs with a 301 to /docs/, so the
          # bare status is a redirect even when Passenger is perfectly healthy.
          docs_status="$(curl -sS -L --max-redirs 3 -o /dev/null -w '%{http_code}' "$API_ORIGIN/docs")"
          # Content-Type and a body are load-bearing, not decoration: LiteSpeed
          # rejects a bodyless, typeless POST with its own HTML 403 before Node
          # ever sees it, on every path. Without them this probe reports the
          # host's opinion rather than the API's.
          cron_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Cron-Secret: host-apply-verification-wrong-secret' \
            -d '{}' \
            "$API_ORIGIN/api/v1/youtube/cron/sync")"
          node tools/scripts/verify-host-apply.mjs "$docs_status" "$cron_status"

  deploy-frontend:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') && !inputs.apply_only }}
    needs: [validate, prepare-dependencies, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Validate production frontend FTP secrets
        env:
          FTP_PROD_HOST: ${{ secrets.FTP_PROD_HOST }}
          FTP_PROD_FRONTEND_USERNAME: ${{ secrets.FTP_PROD_FRONTEND_USERNAME }}
          FTP_PROD_FRONTEND_PASSWORD: ${{ secrets.FTP_PROD_FRONTEND_PASSWORD }}
          FTP_PROD_FRONTEND_DIR: ${{ secrets.FTP_PROD_FRONTEND_DIR }}
        run: |
          set -euo pipefail
          missing=0

          if [ -z "$FTP_PROD_HOST" ]; then echo 'Missing secret: FTP_PROD_HOST'; missing=1; fi
          if [ -z "$FTP_PROD_FRONTEND_USERNAME" ]; then echo 'Missing secret: FTP_PROD_FRONTEND_USERNAME'; missing=1; fi
          if [ -z "$FTP_PROD_FRONTEND_PASSWORD" ]; then echo 'Missing secret: FTP_PROD_FRONTEND_PASSWORD'; missing=1; fi
          if [ -z "$FTP_PROD_FRONTEND_DIR" ]; then echo 'Missing secret: FTP_PROD_FRONTEND_DIR'; missing=1; fi

          if [ "$missing" -ne 0 ]; then
            echo 'One or more required production frontend FTP secrets are not set (or are empty).'
            exit 1
          fi

      - name: Package frontend (cPanel)
        run: corepack yarn package:myorganizer:web

      - name: Deploy frontend to cPanel (production)
        uses: samkirkland/ftp-deploy-action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_PROD_HOST }}
          username: ${{ secrets.FTP_PROD_FRONTEND_USERNAME }}
          password: ${{ secrets.FTP_PROD_FRONTEND_PASSWORD }}
          local-dir: ./dist/deploy/myorganizer-web/
          server-dir: ${{ secrets.FTP_PROD_FRONTEND_DIR }}
          timeout: 300000
