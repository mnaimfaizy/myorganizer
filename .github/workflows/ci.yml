name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authoritative-lockfile-policy:
    name: Authoritative Lockfile Policy
    runs-on: ubuntu-latest

    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo 'Lockfile policy runs only for pull_request events.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Block npm and pnpm lockfiles in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")"

          {
            echo '## Lockfile policy'
            echo
            echo 'Changed files in PR:'
            if [ -n "$changed_files" ]; then
              printf '%s\n' "$changed_files"
            else
              echo '(none)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          disallowed_lockfiles="$(printf '%s\n' "$changed_files" | grep -E '(^|/)(package-lock\.json|pnpm-lock\.yaml)$' || true)"

          if [ -n "$disallowed_lockfiles" ]; then
            echo '::error title=Disallowed lockfile detected::This repository accepts only yarn.lock in pull requests. Remove package-lock.json and pnpm-lock.yaml changes from the PR.'
            {
              echo
              echo 'Disallowed lockfile changes:'
              printf '%s\n' "$disallowed_lockfiles"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'No npm or pnpm lockfiles were introduced or modified in this pull request.' >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check dependency review API availability
        id: dependency-review-availability
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"

          if [ "$status_code" = '200' ]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status_code" = '403' ] || [ "$status_code" = '404' ]; then
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$response_file"
          echo "Unexpected dependency review API response: $status_code" >&2
          exit 1

      - name: Checkout repository
        if: steps.dependency-review-availability.outputs.supported == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: steps.dependency-review-availability.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: development,runtime,unknown

      - name: Explain skipped dependency review
        if: steps.dependency-review-availability.outputs.supported != 'true'
        shell: bash
        env:
          STATUS_CODE: ${{ steps.dependency-review-availability.outputs.status_code }}
        run: |
          echo '::warning title=Dependency review skipped::GitHub dependency review is unavailable for this repository. Enable Dependency graph in repository settings to re-enable this check.'
          {
            echo '## Dependency review skipped'
            echo
            echo "GitHub's dependency review API returned HTTP ${STATUS_CODE:-unknown} for this repository."
            echo
            echo 'Enable Dependency graph in repository settings to re-enable actions/dependency-review-action.'
          } >> "$GITHUB_STEP_SUMMARY"

  secure-install-review:
    name: Secure Install Review
    runs-on: ubuntu-latest
    needs: authoritative-lockfile-policy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependency metadata without scripts
        run: corepack yarn install --immutable --mode=skip-build

      - name: Verify frozen lockfile
        run: |
          git diff --ignore-cr-at-eol --exit-code -- yarn.lock

      - name: Check whether dependency manifests changed
        id: dependency-files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Content-aware, not path-aware: editing a `scripts` entry is not a
          # dependency change. yarn.lock and .yarnrc.yml still always trigger,
          # and every workspace manifest is inspected (the previous check only
          # looked at the root package.json).
          #
          # If the detector itself fails, audit anyway — never skip on error.
          if ! result="$(node tools/scripts/ci/dependency-manifest-changed.mjs "$BASE_SHA" "$HEAD_SHA")"; then
            echo '::warning title=Dependency detection failed::Falling back to running the audit.'
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$result" = 'true' ]; then
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_audit=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Yarn npm audit
        if: github.event_name != 'pull_request' || steps.dependency-files.outputs.run_audit == 'true'
        run: corepack yarn npm audit --all --recursive --severity high

      - name: Explain skipped npm audit
        if: github.event_name == 'pull_request' && steps.dependency-files.outputs.run_audit != 'true'
        shell: bash
        run: |
          echo 'Skipped npm audit because this pull request changes no dependencies: yarn.lock and .yarnrc.yml are untouched, and any package.json edits were confined to non-dependency fields such as `scripts`.' >> "$GITHUB_STEP_SUMMARY"

  prepare-dependencies:
    name: Prepare Dependency Cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: secure-install-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # We intentionally avoid setup-node's Yarn cache integration here.
      # In this repo it can invoke the runner's global Yarn 1 binary before
      # Corepack has a chance to resolve the pinned Yarn 4 version.
      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

  chromatic:
    name: Publish to Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-dependencies

    env:
      STORYBOOK_BUILD_TIMEOUT: '900000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Publish Storybook to Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          CHROMATIC_AUTO_ACCEPT: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u

          if [ -z "${CHROMATIC_PROJECT_TOKEN}" ]; then
            echo '::error title=Missing Chromatic token::Add repository secret CHROMATIC_PROJECT_TOKEN (HITL) before this job can run. See docs/storybook/README.md and ADR 0027.'
            exit 1
          fi

          extra=(--exit-zero-on-changes)
          if [ "${CHROMATIC_AUTO_ACCEPT}" = 'true' ]; then
            extra+=(--auto-accept-changes)
          fi

          if [ "${EVENT_NAME}" = 'pull_request' ]; then
            export CHROMATIC_SHA="${PR_SHA}"
            export CHROMATIC_BRANCH="${PR_BRANCH}"
            export CHROMATIC_SLUG="${REPO}"
          fi

          set +e
          corepack yarn chromatic "${extra[@]}"
          code=$?
          set -e

          if [ "${code}" -eq 11 ]; then
            echo '::warning title=Chromatic quota reached::Free-plan snapshot cap reached (CLI exit 11). Visual tests are paused until the next billing cycle. CI continues per ADR 0027.'
            {
              echo '## Publish to Chromatic'
              echo
              echo 'Snapshot quota reached (`ACCOUNT_QUOTA_REACHED`, exit 11). Job passed by policy so the rest of CI is not frozen for the rest of the month.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # BUILD_HAS_CHANGES: capture succeeded; review lives on Chromatic's "UI Tests"
          # GitHub status (pending until Accept/Deny). Do not fail this job — a re-run
          # recaptures snapshots and burns free-tier quota.
          if [ "${code}" -eq 1 ]; then
            echo '::notice title=Visual changes awaiting review::Accept or Deny in Chromatic. The UI Tests check stays pending until then. Do not re-run this job.'
            {
              echo '## Publish to Chromatic'
              echo
              echo 'Unreviewed visual changes (`BUILD_HAS_CHANGES`). This job passed so snapshots are not recaptured.'
              echo 'Watch Chromatic’s **UI Tests** check: pending until Accept (green) or Deny (red).'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "${code}"

  setup:
    name: Setup Affected Context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-dependencies

    outputs:
      nx_base: ${{ steps.affected.outputs.nx_base }}
      nx_head: ${{ steps.affected.outputs.nx_head }}
      affected_projects: ${{ steps.projects.outputs.affected_projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Compute affected range
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ -z "$BASE" || "$BASE" == '0000000000000000000000000000000000000000' ]]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          fi

          echo "nx_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "nx_head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Using NX_BASE=$BASE"
          echo "Using NX_HEAD=$HEAD"

      - name: Compute affected projects
        id: projects
        shell: bash
        run: |
          set -euo pipefail

          BASE='${{ steps.affected.outputs.nx_base }}'
          HEAD='${{ steps.affected.outputs.nx_head }}'

          if ! AFFECTED_JSON="$(corepack yarn nx show projects --affected --base="$BASE" --head="$HEAD" --json | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); process.stdout.write(JSON.stringify(JSON.parse(input))); ")"; then
            echo 'Error: Failed to compute affected projects JSON from Nx output.' >&2
            exit 1
          fi

          echo "affected_projects=$AFFECTED_JSON" >> "$GITHUB_OUTPUT"
          echo "Affected projects: $AFFECTED_JSON"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-lint-
            ${{ runner.os }}-nx-22-

      - name: Lint affected projects
        run: corepack yarn nx affected -t lint --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup

    env:
      # Required for Prisma v7 config loading during `prisma generate`.
      # CI uses a dummy local URL here because generation does not connect.
      DATABASE_URL: postgresql://localhost:5432/myorganizer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Java 21
        # openapi:check regenerates the client via openapi-generator-cli, which is
        # a Java tool. Pinned explicitly rather than relying on the runner image's
        # preinstalled JDK, which is not part of the runner's stability contract.
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Check OpenAPI spec and generated client are in sync
        # Regenerates the spec and client, then asserts a clean tree. Runs before
        # the hygiene steps so an unrelated step cannot dirty the tree first.
        run: corepack yarn openapi:check

      - name: Component hygiene checker contracts
        run: corepack yarn component:hygiene:test

      - name: Check component hygiene
        run: corepack yarn component:hygiene --all --max-warnings=0

      - name: Test hygiene checker contracts
        run: corepack yarn test:hygiene:test

      - name: Check Jest test hygiene
        run: corepack yarn test:hygiene --all

      - name: PR runner label and merge-base gate contracts
        run: corepack yarn ai:create-pr:test

      - name: Sandcastle resume decision contracts
        run: corepack yarn sandcastle:resume:test

      - name: Sandcastle sub-agent trace contracts
        run: corepack yarn sandcastle:subagent-trace:test

      - name: OpenAPI artifact checker contracts
        run: corepack yarn openapi:artifacts:test

      - name: Lint coverage checker contracts
        run: corepack yarn lint:coverage:test

      # Asserts every project Nx can lint is reachable as `lint`, the target the
      # lint job selects. Five projects were outside it until #426.
      - name: Check lint gate coverage
        run: corepack yarn lint:coverage:check

      - name: Nx graph loader contracts
        run: corepack yarn nx-graph:test

      - name: Typecheck checker contracts
        run: corepack yarn typecheck:check:test

      # apps/backend/src/prisma is generated and gitignored, so a fresh runner
      # has no @prisma/client to compile against. backend:test declares this
      # same dependency; typechecking needs it just as much, and runs first.
      - name: Generate Prisma client
        run: corepack yarn nx run backend:generate-types

      # Compiles every project tsconfig, lib/app and spec alike. Nothing ran
      # TypeScript in CI before this, so two type errors had reached main.
      - name: Typecheck all projects
        run: corepack yarn typecheck:check

      - name: Check libs markdown allowlist
        run: corepack yarn libs:markdown:check

      - name: Check docs notes routing
        run: corepack yarn docs:notes:check

      # ADR numbers collide across concurrent branches, not within one commit:
      # git merges two differently-named files cleanly. This runs in Test
      # because that job checks out refs/pull/N/merge — the merged tree, the
      # only vantage point where both files exist.
      - name: Check ADR numbering
        run: corepack yarn adr:numbering:check

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-test-
            ${{ runner.os }}-nx-22-

      - name: Test affected projects
        run: corepack yarn nx affected -t test --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }}

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'backend') }}
    needs:
      - setup
      - lint
      - test

    env:
      # Required for Prisma v7 config loading during `prisma generate`.
      # CI uses a dummy local URL here because generation does not connect.
      DATABASE_URL: postgresql://localhost:5432/myorganizer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build backend
        run: corepack yarn nx build backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'myorganizer') }}
    needs:
      - setup
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build frontend
        run: corepack yarn nx build myorganizer
