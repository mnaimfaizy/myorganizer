name: Review Tier

# Computes the Review Tier of a Pull Request from its diff (ADR 0070). The job
# output is the truth; the label the second step applies is a display of it,
# and downstream jobs read the output, never the label (item 3).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Review Tier
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      label: ${{ steps.classify.outputs.label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      # Exit 2 means the classifier could not run; it still writes tier=human
      # to $GITHUB_OUTPUT, so the label step below applies human and the run
      # fails visibly rather than silently. A crash before finish() used to
      # leave the output empty; run-review-tier-check.mjs fills human in that
      # case so the label step still has something to display. Shared with
      # code-review.yml (--mode advisory there, so the reviewer still runs).
      - name: Classify the diff
        id: classify
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          corepack yarn review:tier:check \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}' \
            --author "$PR_AUTHOR" \
            --out "$RUNNER_TEMP/review-tier.json"
          node tools/scripts/review/run-review-tier-check.mjs \
            --mode required --status $?

      # The label is a display of the job output, never the truth (ADR 0070
      # item 3). continue-on-error plus the applier's retries keep a GraphQL
      # flake on `gh pr edit` from failing the required check after classify
      # has already written outputs. Evidence for the two #790 runs — 151
      # (job 104334970928: cache hit, classify success, GraphQL flake; logs
      # present) and 147 (job 104326339851: runner_id 0, empty steps, log
      # API BlobNotFound) — and why job 104326383163 is Code Review's Agent
      # Review Ran on the same SHA, not Review Tier, is frozen in
      # docs/research/2026-09-18-review-tier-intermittent-failures.md.
      # A job GitHub never assigned a runner cannot be retried from this YAML;
      # re-run the failed job from the Actions UI. A fork's token cannot write
      # labels; the output above still stands.
      - name: Apply the review tier label
        if: always() && steps.classify.outputs.label != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.classify.outputs.label }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node tools/scripts/review/apply-review-tier-label.mjs \
            --pr "$PR" --label "$LABEL" --repo "$GITHUB_REPOSITORY"
