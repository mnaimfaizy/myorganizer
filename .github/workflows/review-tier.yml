name: Review Tier

# Computes the Review Tier of a Pull Request from its diff (ADR 0070). The job
# output is the truth; the label the second step applies is a display of it,
# and downstream jobs read the output, never the label (item 3).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Review Tier
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      label: ${{ steps.classify.outputs.label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      # Exit 2 means the classifier could not run; it still writes tier=human
      # to $GITHUB_OUTPUT, so the label step below applies human and the run
      # fails visibly rather than silently. A crash before finish() used to
      # leave the output empty; the wrapper below fills human in that case so
      # the label step still has something to display.
      - name: Classify the diff
        id: classify
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          corepack yarn review:tier:check \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}' \
            --author "$PR_AUTHOR" \
            --out "$RUNNER_TEMP/review-tier.json"
          status=$?
          if ! grep -q '^label=review:' "$GITHUB_OUTPUT" 2>/dev/null; then
            echo 'tier=human' >> "$GITHUB_OUTPUT"
            echo 'label=review:human' >> "$GITHUB_OUTPUT"
            echo '::warning::classifier wrote no tier; defaulting to review:human'
            if [ "$status" -eq 0 ]; then status=2; fi
          fi
          exit "$status"

      # The label is a display of the job output, never the truth (ADR 0070
      # item 3). A GitHub GraphQL flake on `gh pr edit` failed the required
      # check on #789 after the classifier had already emitted review:agent
      # (run 34955049214). continue-on-error plus the applier's retries keep
      # that from happening again. A fork's token cannot write labels; the
      # output above still stands.
      #
      # A Review Tier job with no steps and no logs (runner_id 0, Azure
      # BlobNotFound on the log API) is GitHub failing to assign a runner,
      # not a classifier failure — see run 34952437386. Nothing in this
      # workflow can write a log that GitHub never stored.
      - name: Apply the review tier label
        if: always() && steps.classify.outputs.label != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.classify.outputs.label }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node tools/scripts/review/apply-review-tier-label.mjs \
            --pr "$PR" --label "$LABEL" --repo "$GITHUB_REPOSITORY"
