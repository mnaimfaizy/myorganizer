name: Nightly E2E

# The rot detector (ADR 0050). The blocking lane in ci.yml runs Chromium on
# affected pull requests; this runs every browser against `main` where nobody
# is waiting, so it can afford to be strict.
#
# 03:17 UTC: scheduled workflows on public repositories are delayed at peak
# times, so an off-peak odd minute is the standard mitigation. Matches the
# convention already used by monthly-agent-model-audit.yml.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # Every browser reports independently: "webkit broke, the others are
      # fine" is the single most useful fact in a rot report, and this puts it
      # in the job list without anyone reading a log.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            target: e2e
          - browser: firefox
            target: e2e-firefox
          - browser: webkit
            target: e2e-webkit

    env:
      # Playwright's webServer starts Nx as a nested child process, and the Nx
      # daemon does not survive that cleanly on hosted runners.
      NX_DAEMON: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        run: git diff --exit-code -- yarn.lock

      # Only this matrix leg's browser. Playwright advises against caching
      # browser binaries: restoring the cache costs about what downloading does.
      - name: Install Playwright ${{ matrix.browser }}
        run: corepack yarn playwright install --with-deps ${{ matrix.browser }}

      # Built here rather than inside Playwright's webServer timeout, so a build
      # failure is attributable and starting the server is only that.
      - name: Build frontend for E2E
        run: corepack yarn nx build myorganizer

      # --fail-on-flaky-tests lives here and not on the blocking lane. A test
      # that passes on retry is not evidence that a pull request broke
      # something, but it is evidence about suite health — and nobody is
      # blocked here. See ADR 0050.
      - name: Run E2E (${{ matrix.browser }})
        run: corepack yarn nx run myorganizer-e2e:${{ matrix.target }} --fail-on-flaky-tests --reporter=list

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-e2e-report-${{ matrix.browser }}
          path: dist/.playwright/apps/myorganizer-e2e/
          retention-days: 14

  # Schedule only, same as Report Success. A workflow_dispatch failure is a
  # person poking the suite; it must not open a rot issue that the next green
  # nightly would then have to interpret.
  report-failure:
    name: Report Failure
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ failure() && github.event_name == 'schedule' }}

    # Job permissions replace the workflow set, so contents: read is restated.
    # Checkout uses it to load the rot-issue module; issues: write is the only
    # extra scope, and only for the one open issue this job owns.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same shape as monthly-agent-model-audit.yml: one open issue that gets
      # commented on, rather than a new issue every night a failure persists.
      # A new issue is labelled needs-triage and github-actions so it enters
      # the triage queue instead of sitting unlabeled the way #858 did.
      # needs-triage is a state role, so Report Success will comment on that
      # issue and leave it open. The label list lives in
      # tools/scripts/lib/nightly-e2e-rot-issue.mjs — not a second copy here.
      - name: Open or update the rot report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const {
              ROT_ISSUE_TITLE,
              ROT_ISSUE_CREATE_LABELS,
              findOpenRotIssue,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/tools/scripts/lib/nightly-e2e-rot-issue.mjs`,
              ).href
            );

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly Playwright run failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Check which browser legs failed — each browser is its own job.',
              'Per-browser reports are attached to the run as artifacts.',
              '',
              'This lane runs with `--fail-on-flaky-tests`, so a test that passed',
              'only on retry also fails the job. That is deliberate (ADR 0050):',
              'it is how latent `networkidle` and timing debt stays visible',
              'instead of being absorbed by `retries: 2`. See #524.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const match = findOpenRotIssue(existing);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              core.info(`Commented on existing issue #${match.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ROT_ISSUE_TITLE,
              body,
              labels: [...ROT_ISSUE_CREATE_LABELS],
            });
            core.info(`Created issue #${created.data.number}`);

  # A green scheduled run is the only event that means the suite recovered.
  # workflow_dispatch is excluded on purpose: a manual green run is not the
  # nightly, and it must not close a rot issue out from under a real failure
  # the next cron has not yet cleared. A cancelled run is neither success
  # nor failure, so neither report job runs — closing on a run that
  # concurrency cancelled would record a recovery that did not happen.
  #
  # Triage state is the triage skill's state roles: needs-triage, needs-info,
  # ready-for-agent, ready-for-human, wontfix. No state label at all — the
  # shape #858 kept across several green nights — and recovery comments with
  # the run link and closes the issue. Any one of those labels and recovery
  # only comments: the issue is already in someone's queue, including
  # needs-triage, which is what Report Failure puts on a newly created rot
  # issue. Area labels such as github-actions are not state and do not keep
  # it open. The choice itself is recoveryAction() in
  # tools/scripts/lib/nightly-e2e-rot-issue.mjs.
  report-success:
    name: Report Success
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ success() && github.event_name == 'schedule' }}

    # Least privilege. Job permissions replace the workflow set, so
    # contents: read is restated for the checkout. issues: write covers the
    # comment and, when the issue was never triaged, the close. Nothing else.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Close or comment on the rot report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const {
              ROT_ISSUE_TITLE,
              findOpenRotIssue,
              recoveryAction,
              recoveryComment,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/tools/scripts/lib/nightly-e2e-rot-issue.mjs`,
              ).href
            );

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = findOpenRotIssue(existing);

            if (!match) {
              core.info(`No open issue titled ${ROT_ISSUE_TITLE}`);
              return;
            }

            const action = recoveryAction(match.labels);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: recoveryComment({
                action,
                runUrl,
                date: new Date().toISOString().slice(0, 10),
              }),
            });

            if (action === 'close') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed rot issue #${match.number}`);
              return;
            }

            core.info(`Suite recovered; left triaged issue #${match.number} open`);
