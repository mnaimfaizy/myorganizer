name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-github-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$PUSHED_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '$tag' is not a semantic release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      # ADR 0064: an Escape Copy is opened by a tool that needs nothing of
      # ours, and the distribution answer is a file the User holds with a
      # checksum they can check. Built from the tag being published, so the
      # reader attached to a release is the reader that release's exporter
      # produces envelopes for.
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build the standalone Escape Copy reader
        run: corepack yarn escape-copy-reader:build

      - name: Create or update GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const notesPath = 'RELEASE_NOTES.md';

            if (!fs.existsSync(notesPath)) {
              core.setFailed(`Missing ${notesPath} at ${tag}.`);
              return;
            }

            const body = fs.readFileSync(notesPath, 'utf8').trim();
            if (!body) {
              core.setFailed(`${notesPath} is empty at ${tag}.`);
              return;
            }

            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body,
              draft: false,
              prerelease: false,
            };

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: release.owner,
                repo: release.repo,
                tag: release.tag_name,
              });

              await github.rest.repos.updateRelease({
                owner: release.owner,
                repo: release.repo,
                release_id: existing.data.id,
                name: release.name,
                body: release.body,
                draft: release.draft,
                prerelease: release.prerelease,
              });
              core.info(`Updated GitHub Release ${tag}.`);
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease(release);
              core.info(`Created GitHub Release ${tag}.`);
            }

      - name: Attach the Escape Copy reader and its checksum
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = process.env.RELEASE_TAG;
            const dir = 'dist/escape-copy-reader';

            const assets = [
              'myorganizer-escape-copy-reader.html',
              'SHA256SUMS.txt',
            ];

            for (const name of assets) {
              if (!fs.existsSync(path.join(dir, name))) {
                core.setFailed(`Missing ${dir}/${name}; the reader build did not produce it.`);
                return;
              }
            }

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            // Replaced rather than skipped when it already exists: a re-run of
            // this workflow at the same tag must leave the published checksum
            // describing the published file, and an upload that silently kept
            // an older asset is exactly the mismatch that trains Users to stop
            // checking.
            for (const existing of release.data.assets) {
              if (assets.includes(existing.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
            }

            for (const name of assets) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                data: fs.readFileSync(path.join(dir, name)),
              });
              core.info(`Attached ${name} to ${tag}.`);
            }
