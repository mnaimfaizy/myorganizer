name: Monthly Agent Model Audit

on:
  schedule:
    - cron: '17 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-agent-model-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Check model assignments and catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Audit assignments and official model catalogs
        id: audit
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/agent-model-audit.md
        run: |
          set +e
          node tools/scripts/audit-agent-model-catalog.mjs \
            --report "$REPORT_PATH"
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update drift issue
        if: steps.audit.outputs.exit_code == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/agent-model-audit.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const title = '[automation] Agent model governance drift';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = [
              'The monthly model audit found assignment drift, a model/pricing source change, or a possible deprecation.',
              '',
              report,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the evidence before changing assignments. The automation deliberately does not rewrite model pins or open a code PR.',
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated issue #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info(`Created issue #${created.data.number}`);

      - name: Fail when governance findings remain
        if: steps.audit.outputs.exit_code != '0'
        shell: bash
        run: exit 1
